name: Radar Guided Sales Mobile One Shot

on:
  push:
    branches:
      - fix/radar-guided-sales-mobile-01
    paths:
      - .github/workflows/radar-guided-sales-mobile-one-shot.yml
      - .github/scripts/apply_radar_guided_sales.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/radar-guided-sales-mobile-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply guided sales fixes
        run: python .github/scripts/apply_radar_guided_sales.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify full Connect quality
        run: |
          npm run lint
          npm run test:core-http
          npm run test:radar-pilot
          npm run test:zerocost
          npm run test:gatewaytenant
          npm run test:authority
          npm run test:chartdelivery
          npm run test:firebase-hosting
          npm run test:release-policy
          npm run build
          npm run build:core
      - name: Commit verified product changes
        run: |
          git rm .github/workflows/radar-guided-sales-mobile-one-shot.yml .github/scripts/apply_radar_guided_sales.py
          git rm -f dist-core/server.cjs dist-core/server.cjs.map || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/personal/radar/composerPlaybook.ts src/core/client/personalRadarClient.ts src/personal/radar/personalRadarService.ts src/features/radar/RadarPage.tsx src/tests/composerPlaybook.test.ts
          git commit -m "Fix Radar guided sales flow on mobile"
          git push origin HEAD:fix/radar-guided-sales-mobile-01
