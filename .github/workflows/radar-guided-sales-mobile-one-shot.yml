name: Radar Guided Sales Mobile One Shot

on:
  push:
    branches:
      - fix/radar-guided-sales-mobile-01
    paths:
      - .github/workflows/radar-guided-sales-mobile-one-shot.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/radar-guided-sales-mobile-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply guided sales fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # --- Composer playbook: explicit commercial stages ---
          p=Path('src/personal/radar/composerPlaybook.ts')
          s=p.read_text()
          s=s.replace("  | 'descobrir_dor'\n  | 'pedir_video'", "  | 'descobrir_dor'\n  | 'contar_historia'\n  | 'pedir_video'\n  | 'enviar_video'\n  | 'diagnosticar'")
          s=s.replace("function resolveStage(signal: RadarSignal, objective?: ComposerObjective): number {\n  if (objective === 'pedir_video') return 4;", "function resolveStage(signal: RadarSignal, objective?: ComposerObjective): number {\n  if (objective === 'contar_historia') return 3;\n  if (objective === 'pedir_video') return 4;\n  if (objective === 'enviar_video') return 5;\n  if (objective === 'diagnosticar') return 6;")
          s=s.replace("  if (stage === 2) return 'descobrir_dor';\n  if (stage === 4)", "  if (stage === 2) return 'descobrir_dor';\n  if (stage === 3) return 'contar_historia';\n  if (stage === 4)")
          s=s.replace("  if (stage === 4) return 'pedir_video';\n  if (stage === 7)", "  if (stage === 4) return 'pedir_video';\n  if (stage === 5) return 'enviar_video';\n  if (stage === 6) return 'diagnosticar';\n  if (stage === 7)")

          marker="function focusedVariants(name: string, signal: RadarSignal, style: ComposerStyle): string[] {"
          extra=r'''function videoSendVariants(name: string, signal: RadarSignal, style: ComposerStyle): string[] {
  const g = greeting(name, style);
  const t = topic(signal);
  return [
    `${g} Como combinamos, vou te mandar um vídeo bem curto mostrando justamente a parte de ${t}. Depois me diz se isso faria diferença aí para vocês.`,
    `${g} Separei um vídeo rápido do MusicScale focado em ${t}. Assiste quando puder e depois quero saber qual parte mais conversa com a realidade de vocês.`,
    `${g} Te mando agora uma demonstração curtinha. Repara principalmente na parte de ${t}; depois me fala se hoje isso ajudaria a equipe daí.`,
  ].map(text => soften(style, text));
}

function diagnosticVariants(name: string, signal: RadarSignal, style: ComposerStyle): string[] {
  const g = greeting(name, style);
  const t = topic(signal);
  return [
    `${g} Do que você viu, qual parte faria mais diferença aí hoje: ${t}, a organização da equipe ou as confirmações?`,
    `${g} Pensando na rotina de vocês, o que mais te chamou atenção no vídeo? Quero entender antes de te mostrar qualquer outra coisa.`,
    `${g} Se você pudesse resolver só uma parte da organização do louvor agora, qual seria?`,
  ].map(text => soften(style, text));
}

function videoScriptVariants(name: string, signal: RadarSignal, style: ComposerStyle): string[] {
  const t = topic(signal);
  const who = name ? `, ${name}` : '';
  return [
    `Oi${who}! Gravei rapidinho porque é mais fácil te mostrar. O MusicScale nasceu da nossa própria rotina de igreja. Aqui a equipe recebe a escala, vê repertório, cifras e tons e confirma presença sem depender de mensagem perdida. Pensando no que você comentou sobre ${t}, olha como essa parte fica organizada.`,
    `Oi${who}! Em menos de meio minuto eu quero te mostrar só uma coisa. A gente tinha muita informação espalhada no WhatsApp e criou o MusicScale para centralizar a rotina do louvor. Repara especialmente nessa parte de ${t}, porque foi exatamente o ponto que lembrei da nossa conversa.`,
    `Oi${who}! Vou te mostrar sem apresentação comercial, só na prática. Aqui está uma escala real: equipe, músicas, cifras, tons e confirmação num lugar só. Pelo que você falou sobre ${t}, acho que essa é a parte que mais vale você olhar primeiro.`,
  ].map(text => soften(style, text));
}

'''
          if marker not in s: raise SystemExit('focused marker missing')
          s=s.replace(marker,extra+marker,1)

          old="""  let texts: string[];\n  let effectiveChannel = channel;\n  if (channel === 'audio') {\n    texts = audioVariants(name, input.signal, style);\n  } else if (objective === 'pedir_video') {"""
          new="""  let texts: string[];\n  let effectiveChannel = channel;\n  if (objective === 'contar_historia') {\n    texts = audioVariants(name, input.signal, style);\n    effectiveChannel = 'audio';\n  } else if (objective === 'enviar_video' && channel === 'video') {\n    texts = videoScriptVariants(name, input.signal, style);\n    effectiveChannel = 'video';\n  } else if (objective === 'enviar_video') {\n    texts = videoSendVariants(name, input.signal, style);\n  } else if (objective === 'diagnosticar') {\n    texts = diagnosticVariants(name, input.signal, style);\n  } else if (channel === 'audio') {\n    texts = audioVariants(name, input.signal, style);\n  } else if (objective === 'pedir_video') {"""
          if old not in s: raise SystemExit('composer routing marker missing')
          s=s.replace(old,new,1)

          s=s.replace("    : stage === 4\n      ? 'Peça permissão antes de mandar o vídeo. O próximo passo é um pequeno “sim”.'", "    : stage === 3\n      ? 'Conte a história em 35–50 segundos, como conversa. Termine pedindo permissão para mostrar.'\n      : stage === 4\n      ? 'Peça permissão antes de mandar o vídeo. O próximo passo é um pequeno “sim”.'\n      : stage === 5\n        ? 'Mostre só o necessário em cerca de 30 segundos e conecte a demonstração à dor real da conversa.'\n        : stage === 6\n          ? 'Depois do vídeo, faça uma pergunta diagnóstica. Não continue apresentando recursos sem ouvir a resposta.'")
          p.write_text(s)

          # --- Client: expose the new stage objectives ---
          p=Path('src/core/client/personalRadarClient.ts')
          s=p.read_text()
          s=s.replace("      objective?: 'iniciar_conversa' | 'descobrir_dor' | 'pedir_video' | 'explicar_dor'", "      objective?: 'iniciar_conversa' | 'descobrir_dor' | 'contar_historia' | 'pedir_video' | 'enviar_video' | 'diagnosticar' | 'explicar_dor'")
          p.write_text(s)

          # --- Service: allow clearing an invalid/manual phone instead of keeping stale data ---
          p=Path('src/personal/radar/personalRadarService.ts')
          s=p.read_text()
          old="""    const digits = typeof input.phone === 'string' ? input.phone.replace(/\\D/g, '') : '';\n    if (digits && (digits.length < 10 || digits.length > 15)) throw new Error('PHONE_INVALID');"""
          new="""    const hasPhoneUpdate = typeof input.phone === 'string';\n    const digits = hasPhoneUpdate ? input.phone!.replace(/\\D/g, '') : '';\n    if (digits && (digits.length < 10 || digits.length > 15)) throw new Error('PHONE_INVALID');"""
          if old not in s: raise SystemExit('phone validation marker missing')
          s=s.replace(old,new,1)
          old="phone: digits || person.phone || null,"
          new="phone: hasPhoneUpdate ? (digits || null) : (person.phone || null),"
          if old not in s: raise SystemExit('phone persistence marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # --- Radar UI: stage-aware Composer as an actual mobile bottom sheet ---
          p=Path('src/features/radar/RadarPage.tsx')
          s=p.read_text()
          type_marker="type ComposerStyle = 'amigavel' | 'profissional' | 'descontraido' | 'objetivo' | 'proximo' | 'pastoral' | 'consultivo';"
          type_extra=type_marker+"\ntype ComposerObjective = 'iniciar_conversa' | 'descobrir_dor' | 'contar_historia' | 'pedir_video' | 'enviar_video' | 'diagnosticar' | 'explicar_dor' | 'convidar_trial' | 'acompanhar_trial' | 'retomar_conversa' | 'fechar';"
          if type_marker not in s: raise SystemExit('composer type marker missing')
          s=s.replace(type_marker,type_extra,1)

          export_marker="export const RadarPage: React.FC<RadarPageProps> = ({ session, currentLang }) => {"
          helper=r'''type StageOption = { n: string; label: Record<LanguageCode,string>; objective: ComposerObjective };
const SALES_STAGES: StageOption[] = [
  { n:'1', label:{'pt-BR':'Início','en-US':'Start','es-ES':'Inicio'}, objective:'iniciar_conversa' },
  { n:'2', label:{'pt-BR':'Descoberta','en-US':'Discovery','es-ES':'Descubrimiento'}, objective:'descobrir_dor' },
  { n:'3', label:{'pt-BR':'História','en-US':'Story','es-ES':'Historia'}, objective:'contar_historia' },
  { n:'4', label:{'pt-BR':'Pedir vídeo','en-US':'Ask video','es-ES':'Pedir video'}, objective:'pedir_video' },
  { n:'5', label:{'pt-BR':'Vídeo','en-US':'Video','es-ES':'Video'}, objective:'enviar_video' },
  { n:'6', label:{'pt-BR':'Diagnóstico','en-US':'Diagnosis','es-ES':'Diagnóstico'}, objective:'diagnosticar' },
  { n:'7', label:{'pt-BR':'Resposta','en-US':'Focused reply','es-ES':'Respuesta'}, objective:'explicar_dor' },
  { n:'8', label:{'pt-BR':'Trial','en-US':'Trial','es-ES':'Prueba'}, objective:'convidar_trial' },
  { n:'9', label:{'pt-BR':'Acompanhar','en-US':'Follow trial','es-ES':'Acompañar'}, objective:'acompanhar_trial' },
  { n:'10', label:{'pt-BR':'Fechar','en-US':'Close','es-ES':'Cerrar'}, objective:'fechar' },
  { n:'↺', label:{'pt-BR':'Retomar','en-US':'Follow-up','es-ES':'Retomar'}, objective:'retomar_conversa' },
];

function radarSalesUi(lang: LanguageCode) {
  const all = {
    'pt-BR': { journey:'Etapa da conversa', journeyHelp:'Escolha onde você realmente está. O Connect adapta a mensagem ao próximo pequeno passo.', messages:'Mensagens sugeridas', tip:'Dica para esta etapa', context:'Contexto real usado', close:'Fechar', phonePlaceholder:'Número opcional — não inventamos contatos', phoneNote:'O site não consegue ler automaticamente a agenda do iPhone. Sem número, abrimos o WhatsApp para você escolher a pessoa; com número real, abrimos a conversa direto.', chooseWhatsapp:'Abrir WhatsApp e escolher contato', directWhatsapp:'Abrir conversa no WhatsApp', invalidPhone:'Número salvo parece de teste e foi ignorado. Salve um número real ou deixe vazio.', edit:'Edite antes de enviar', format:'Formato da abordagem' },
    'en-US': { journey:'Conversation stage', journeyHelp:'Choose where the conversation really is. Connect adapts the message to the next small step.', messages:'Suggested messages', tip:'Tip for this stage', context:'Real context used', close:'Close', phonePlaceholder:'Optional number — we never invent contacts', phoneNote:'The website cannot automatically read your iPhone contacts. Without a number, WhatsApp opens so you can choose the person; with a real number, it opens the chat directly.', chooseWhatsapp:'Open WhatsApp and choose contact', directWhatsapp:'Open WhatsApp chat', invalidPhone:'Saved number looks like test data and was ignored. Save a real number or leave it blank.', edit:'Edit before sending', format:'Approach format' },
    'es-ES': { journey:'Etapa de la conversación', journeyHelp:'Elige dónde está realmente la conversación. Connect adapta el mensaje al próximo pequeño paso.', messages:'Mensajes sugeridos', tip:'Consejo para esta etapa', context:'Contexto real usado', close:'Cerrar', phonePlaceholder:'Número opcional — nunca inventamos contactos', phoneNote:'El sitio no puede leer automáticamente los contactos del iPhone. Sin número, abrimos WhatsApp para que elijas la persona; con número real, abrimos el chat directamente.', chooseWhatsapp:'Abrir WhatsApp y elegir contacto', directWhatsapp:'Abrir chat de WhatsApp', invalidPhone:'El número guardado parece de prueba y fue ignorado. Guarda un número real o déjalo vacío.', edit:'Edita antes de enviar', format:'Formato del enfoque' },
  } as const;
  return all[lang];
}

function normalizePhoneForUse(value?: string | null): string {
  const digits=String(value||'').replace(/\D/g,'');
  if (digits.length < 10 || digits.length > 15) return '';
  if (/(0{7,}|9{8,}|1{8,})$/.test(digits)) return '';
  return digits;
}

'''
          if export_marker not in s: raise SystemExit('export marker missing')
          s=s.replace(export_marker,helper+export_marker,1)

          state_marker="  const [composerStyle, setComposerStyle] = useState<ComposerStyle>('consultivo');"
          state_extra=state_marker+"\n  const [composerObjective, setComposerObjective] = useState<ComposerObjective>('iniciar_conversa');\n  const [composerError, setComposerError] = useState('');"
          if state_marker not in s: raise SystemExit('state marker missing')
          s=s.replace(state_marker,state_extra,1)

          old="setPhones(Object.fromEntries(result.people.map(person => [person.id, person.phone || ''])));"
          new="setPhones(Object.fromEntries(result.people.map(person => [person.id, normalizePhoneForUse(person.phone)])));"
          if old not in s: raise SystemExit('phone hydrate marker missing')
          s=s.replace(old,new,1)

          start=s.index("  const compose = async (selection = selected, requestedTone = tone, requestedStyle = composerStyle) => {")
          end=s.index("\n  const snoozePerson", start)
          new_compose=r'''  const compose = async (
    selection = selected,
    requestedTone = tone,
    requestedStyle = composerStyle,
    requestedObjective = composerObjective,
  ) => {
    if (!selection) return;
    setDraftBusy(true);
    setCopied(false);
    setComposerError('');
    try {
      const channel = requestedTone === 'audio' ? 'audio' : requestedTone === 'video' ? 'video' : requestedObjective === 'retomar_conversa' ? 'followup' : 'texto';
      const result = await client.compose(selection.person.id, selection.signal.id, requestedTone, {
        style: requestedStyle,
        objective: requestedObjective,
        channel,
      });
      setComposerPlan(result);
      setDraft(result.draft || result.options?.[0]?.text || '');
      setError('');
    } catch (e) {
      const message = e instanceof Error ? e.message : t.error;
      setComposerError(message);
      setError(message);
    } finally {
      setDraftBusy(false);
    }
  };

  const openComposer = (person: RadarClientPerson, signal: RadarClientPerson['signals'][number]) => {
    const selection = { person, signal };
    const initialStyle: ComposerStyle = signal.type === 'unanswered_conversation' || signal.type === 'recurring_relevant_topic' ? 'pastoral' : signal.type === 'commercial_followup_due' ? 'proximo' : 'consultivo';
    const initialObjective: ComposerObjective = signal.type === 'explicit_product_interest' ? 'descobrir_dor' : 'iniciar_conversa';
    setSelected(selection);
    setDraft('');
    setComposerPlan(null);
    setComposerError('');
    setComposerStyle(initialStyle);
    setComposerObjective(initialObjective);
    setTone('curto');
    void compose(selection, 'curto', initialStyle, initialObjective);
  };
'''
          s=s[:start]+new_compose+s[end:]

          marker="  const totalSignals = people.reduce((sum, person) => sum + (person.signals?.length || 0), 0);"
          helper_inside=r'''  const openWhatsApp = (message: string, rawPhone?: string) => {
    const phone = normalizePhoneForUse(rawPhone);
    const url = phone
      ? `https://wa.me/${phone}?text=${encodeURIComponent(message)}`
      : `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank', 'noopener,noreferrer');
  };

'''
          if marker not in s: raise SystemExit('total signals marker missing')
          s=s.replace(marker,helper_inside+marker,1)

          old='<div className="flex flex-col gap-2 border-t border-white/8 bg-black/10 p-4 sm:flex-row sm:items-center"><label className="text-xs text-slate-500 sm:min-w-32">{t.phone}</label><input value={phones[person.id] || \'\'} onChange={e => setPhones(prev => ({ ...prev, [person.id]: e.target.value }))} placeholder="5543999999999" className="min-h-10 flex-1 rounded-xl border border-white/10 bg-black/20 px-3 text-sm text-white outline-none" /><button onClick={async () => { await client.updatePerson(person.id, { phone: phones[person.id] }); await refresh(); }} className="min-h-10 rounded-xl border border-white/10 px-3 text-xs font-medium text-slate-300">{t.savePhone}</button></div>'
          new='<div className="border-t border-white/8 bg-black/10 p-4"><div className="flex flex-col gap-2 sm:flex-row sm:items-center"><label className="text-xs text-slate-500 sm:min-w-32">{t.phone}</label><input type="tel" inputMode="tel" autoComplete="tel" value={phones[person.id] || \'\'} onChange={e => setPhones(prev => ({ ...prev, [person.id]: e.target.value }))} placeholder={radarSalesUi(currentLang).phonePlaceholder} className="min-h-10 flex-1 rounded-xl border border-white/10 bg-black/20 px-3 text-sm text-white outline-none" /><button type="button" onClick={async () => { await client.updatePerson(person.id, { phone: phones[person.id] || \'\' }); await refresh(); }} className="min-h-10 rounded-xl border border-white/10 px-3 text-xs font-medium text-slate-300">{t.savePhone}</button></div><p className="mt-2 text-[11px] leading-5 text-slate-500">{radarSalesUi(currentLang).phoneNote}</p></div>'
          if old not in s: raise SystemExit('phone row marker missing')
          s=s.replace(old,new,1)

          # Ensure the card CTA is a real explicit button.
          s=s.replace('<button onClick={() => openComposer(person, signal)} className="mt-4 inline-flex', '<button type="button" onClick={() => openComposer(person, signal)} className="mt-4 inline-flex')

          modal_start=s.index('      {selected && <section className="sticky bottom-4')
          main_end=s.rindex('    </main>')
          modal=r'''      {selected && (() => {
        const ui = radarSalesUi(currentLang);
        const phone = normalizePhoneForUse(phones[selected.person.id]);
        return <div className="fixed inset-0 z-[100] flex items-end bg-black/70 backdrop-blur-sm sm:items-center sm:justify-center" onClick={() => setSelected(null)}>
          <section className="max-h-[92dvh] w-full overflow-y-auto rounded-t-[30px] border border-white/10 bg-[#0d111b] shadow-2xl sm:max-w-3xl sm:rounded-[30px]" onClick={e => e.stopPropagation()}>
            <div className="sticky top-0 z-10 flex items-center justify-between border-b border-white/8 bg-[#0d111b]/95 px-5 py-4 backdrop-blur-xl">
              <div><div className="text-xs font-semibold tracking-wide text-indigo-300">{t.composerTitle}</div><div className="mt-1 text-base font-semibold text-white">{selected.person.displayName}</div></div>
              <button type="button" aria-label={ui.close} onClick={() => setSelected(null)} className="grid h-10 w-10 place-items-center rounded-full border border-white/10 text-xl text-slate-300">×</button>
            </div>

            <div className="space-y-5 p-5">
              <div>
                <div className="text-xs font-semibold text-white">{ui.journey}</div>
                <p className="mt-1 text-xs leading-5 text-slate-500">{ui.journeyHelp}</p>
                <div className="-mx-1 mt-3 flex gap-2 overflow-x-auto px-1 pb-2">
                  {SALES_STAGES.map(stage => <button type="button" key={stage.objective} onClick={() => { setComposerObjective(stage.objective); void compose(selected, tone, composerStyle, stage.objective); }} className={`shrink-0 rounded-xl border px-3 py-2 text-left ${composerObjective === stage.objective ? 'border-indigo-400/40 bg-indigo-400/10 text-white' : 'border-white/8 bg-white/[0.025] text-slate-400'}`}><span className="mr-1.5 text-[10px] font-semibold text-indigo-300">{stage.n}</span><span className="text-xs font-medium">{stage.label[currentLang]}</span></button>)}
                </div>
              </div>

              {composerError && <div className="rounded-xl border border-red-400/20 bg-red-400/[0.06] p-3 text-xs leading-5 text-red-200">{composerError}</div>}

              {composerPlan && <div className="grid gap-2 sm:grid-cols-3">
                <div className="rounded-2xl border border-indigo-400/15 bg-indigo-400/[0.06] p-3 sm:col-span-3"><div className="text-[10px] font-semibold uppercase tracking-wider text-indigo-300">{composerPlan.stageLabel} · {t.guidance}</div><p className="mt-1 text-sm leading-6 text-slate-100">{composerPlan.recommendation}</p></div>
                <div className="rounded-xl border border-white/8 bg-black/15 p-3"><div className="text-[10px] font-semibold uppercase text-slate-500">{t.why}</div><p className="mt-1 text-xs leading-5 text-slate-400">{composerPlan.why}</p></div>
                <div className="rounded-xl border border-white/8 bg-black/15 p-3"><div className="text-[10px] font-semibold uppercase text-slate-500">{t.nextYes}</div><p className="mt-1 text-xs leading-5 text-slate-400">{composerPlan.nextSmallYes}</p></div>
                <div className="rounded-xl border border-white/8 bg-black/15 p-3"><div className="text-[10px] font-semibold uppercase text-slate-500">{ui.tip}</div><p className="mt-1 text-xs leading-5 text-slate-400">{composerPlan.tip}</p></div>
              </div>}

              <div className="grid gap-4 sm:grid-cols-2">
                <div><div className="text-[10px] font-semibold uppercase tracking-wider text-slate-500">{ui.format}</div><div className="mt-2 flex flex-wrap gap-1.5">{([['curto', t.short], ['conversa', t.conversation], ['audio', t.audio], ['video', t.video]] as Array<[Tone,string]>).map(([value,label]) => <button type="button" key={value} onClick={() => { setTone(value); void compose(selected, value, composerStyle, composerObjective); }} className={`rounded-lg px-2.5 py-1.5 text-xs ${tone === value ? 'bg-indigo-500 text-white' : 'bg-white/5 text-slate-400'}`}>{label}</button>)}</div></div>
                <div><div className="text-[10px] font-semibold uppercase tracking-wider text-slate-500">{t.style}</div><div className="mt-2 flex flex-wrap gap-1.5">{(['amigavel','profissional','descontraido','objetivo','proximo','pastoral','consultivo'] as ComposerStyle[]).map(value => <button type="button" key={value} onClick={() => { setComposerStyle(value); void compose(selected, tone, value, composerObjective); }} className={`rounded-lg px-2.5 py-1.5 text-xs ${composerStyle === value ? 'bg-white text-slate-950' : 'bg-white/5 text-slate-400'}`}>{composerStyleLabel(value,currentLang)}</button>)}</div></div>
              </div>

              {composerPlan?.factsUsed?.length > 0 && <div className="rounded-xl border border-white/8 bg-black/15 p-3"><div className="text-[10px] font-semibold uppercase tracking-wider text-slate-500">{ui.context}</div><div className="mt-2 space-y-1.5">{composerPlan.factsUsed.map((fact:string,index:number) => <p key={`${fact}-${index}`} className="text-xs leading-5 text-slate-400">{fact}</p>)}</div></div>}

              <div>
                <div className="mb-2 flex items-center justify-between"><div className="text-xs font-semibold text-white">{ui.messages}</div><span className="text-[10px] text-slate-500">{ui.edit}</span></div>
                {composerPlan?.options?.length > 0 && <div className="grid gap-2">{composerPlan.options.map((option:any,index:number) => <button type="button" key={option.id || index} onClick={() => { setDraft(option.text); setCopied(false); }} className={`rounded-xl border p-3 text-left text-xs leading-5 ${draft === option.text ? 'border-indigo-400/40 bg-indigo-400/[0.08] text-slate-100' : 'border-white/8 bg-black/15 text-slate-400'}`}><span className="mr-2 font-semibold text-indigo-300">{index+1}.</span>{option.text}</button>)}</div>}
                <div className="mt-3">{draftBusy ? <div className="grid min-h-28 place-items-center rounded-2xl border border-white/10 bg-black/20 p-4 text-sm text-slate-400"><div className="flex items-center gap-2"><Loader2 size={15} className="animate-spin" /> {t.regenerate}…</div></div> : <textarea value={draft} onChange={e => { setDraft(e.target.value); setCopied(false); }} rows={6} className="min-h-32 w-full resize-y rounded-2xl border border-white/10 bg-black/20 p-4 text-sm leading-6 text-slate-100 outline-none focus:border-indigo-400/40" />}</div>
              </div>

              <div className="grid gap-2 sm:grid-cols-3">
