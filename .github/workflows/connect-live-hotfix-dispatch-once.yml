name: Connect Live Hotfix Dispatch Once

on:
  push:
    branches:
      - production
    paths:
      - '.github/workflows/connect-live-hotfix-dispatch-once.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: connect-live-hotfix-dispatch-once
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dispatch canonical Connect production release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run connect-core-production-release.yml \
            --repo "$REPO" \
            --ref production \
            -f live_mode=true \
            -f live_activation_ack=CONNECT_LIVE_READY

          RUN_ID=""
          for i in {1..18}; do
            RUN_ID="$(gh run list \
              --repo "$REPO" \
              --workflow connect-core-production-release.yml \
              --branch production \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha,createdAt \
              --jq '.[] | select(.headSha == env.RELEASE_SHA) | .databaseId' \
              | head -n 1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          test -n "$RUN_ID"
          echo "CONNECT_RELEASE_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status --interval 10

          echo "CONNECT_LIVE_HOTFIX_RELEASE_DISPATCH_OK"
