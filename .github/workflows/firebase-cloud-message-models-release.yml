name: Firebase Cloud Message Models Release

on:
  push:
    branches:
      - production
    paths:
      - .github/workflows/firebase-cloud-message-models-release.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch certified Connect production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run connect-core-production-release.yml \
            --repo "${{ github.repository }}" \
            --ref production \
            -f live_mode=true \
            -f live_activation_ack=CONNECT_LIVE_READY
