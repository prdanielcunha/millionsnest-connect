name: Temporary Live Core Release Prep

on:
  push:
    branches:
      - release/connect-live-core-01

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/release/connect-live-core-01'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/connect-live-core-01
          fetch-depth: 0

      - name: Cherry-pick certified Connect live stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for sha in \
            7515833acfe9d7b030a7396a5f371724625d71f6 \
            0bb270819531bba305fd8a40a51bfe9d878ed5a6 \
            6cc122d5f3725936a00cbcf7e5ef60fda22c5834 \
            2f6d151a91206041683830760f164ead4b51fa5b
          do
            git fetch origin "$sha"
            git cherry-pick "$sha"
          done
          git rm .github/workflows/temp-live-core-release-prep.yml
          git commit --amend --no-edit
          git push origin HEAD:release/connect-live-core-01
