name: Connect WhatsApp Production Activation

on:
  workflow_dispatch:
    inputs:
      activation_ack:
        description: "Type CONNECT_WHATSAPP_PRODUCTION_READY"
        required: true
        default: ""
        type: string
  push:
    branches: [ production ]
    paths:
      - ".github/whatsapp-production-activation.json"
      - ".github/workflows/connect-whatsapp-production-activation.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: connect-whatsapp-production-activation
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  REGION: us-central1
  SERVICE: connect-api
  PUBLIC_ORIGIN: ${{ vars.CONNECT_WHATSAPP_PUBLIC_ORIGIN || 'https://connect.millionsnest.com' }}
  META_PHONE_NUMBER_ID: ${{ vars.CONNECT_WHATSAPP_PHONE_NUMBER_ID }}
  META_WABA_ID: ${{ vars.CONNECT_WHATSAPP_WABA_ID }}
  META_GRAPH_VERSION: ${{ vars.CONNECT_WHATSAPP_GRAPH_API_VERSION }}
  CONNECT_ORGANIZATION_ID: ${{ vars.CONNECT_WHATSAPP_ORGANIZATION_ID }}
  CONNECT_CONNECTION_REF: ${{ vars.CONNECT_WHATSAPP_CONNECTION_REF || 'primary' }}
  META_APP_SECRET: ${{ secrets.CONNECT_WHATSAPP_APP_SECRET }}
  META_ACCESS_TOKEN: ${{ secrets.CONNECT_WHATSAPP_ACCESS_TOKEN }}
  META_VERIFY_TOKEN: ${{ secrets.CONNECT_WHATSAPP_WEBHOOK_VERIFY_TOKEN }}

jobs:
  activate:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Guard activation intent and configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ inputs.activation_ack }}" = "CONNECT_WHATSAPP_PRODUCTION_READY"
          else
            node - <<'NODE'
          const fs = require('fs');
          const marker = JSON.parse(fs.readFileSync('.github/whatsapp-production-activation.json', 'utf8'));
          if (marker.activation !== 'CONNECT_WHATSAPP_PRODUCTION_READY') {
            throw new Error('WHATSAPP_PRODUCTION_ACTIVATION_MARKER_INVALID');
          }
          NODE
          fi

          missing=0
          for name in META_PHONE_NUMBER_ID META_WABA_ID META_GRAPH_VERSION CONNECT_ORGANIZATION_ID META_APP_SECRET META_ACCESS_TOKEN META_VERIFY_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required WhatsApp production configuration: $name"
              missing=1
            fi
          done
          test "$missing" = "0"

          [[ "$META_PHONE_NUMBER_ID" =~ ^[0-9]{5,30}$ ]]
          [[ "$META_WABA_ID" =~ ^[0-9]{5,30}$ ]]
          [[ "$META_GRAPH_VERSION" =~ ^v[0-9]{1,3}\.[0-9]{1,3}$ ]]
          test -n "$CONNECT_CONNECTION_REF"
          test "${#CONNECT_ORGANIZATION_ID}" -le 180
          test "${#CONNECT_CONNECTION_REF}" -le 180

          # The gcloud alternate delimiter below is deliberately chosen to keep
          # the JSON binding atomic. Refuse values that would make parsing unsafe.
          for name in META_APP_SECRET META_ACCESS_TOKEN META_VERIFY_TOKEN CONNECT_ORGANIZATION_ID CONNECT_CONNECTION_REF; do
            if [[ "${!name}" == *"@"* ]]; then
              echo "::error::$name contains reserved activation delimiter @"
              exit 1
            fi
          done

          echo "CONNECT_WHATSAPP_ACTIVATION_CONFIG_PRESENT"

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Prove current Connect storage gate
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PUBLIC_ORIGIN%/}"
          curl --fail --silent --show-error --location             --retry 8 --retry-delay 2 --retry-all-errors             "$BASE/api/health/storage-readiness" -o /tmp/connect-storage.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/connect-storage.json', 'utf8'));
          if (x.success !== true || x.storageReadiness !== 'read_write_confirmed') {
            throw new Error('CONNECT_STORAGE_NOT_READY');
          }
          console.log('CONNECT_WHATSAPP_STORAGE_GATE_OK');
          NODE

      - name: Prove Hub channel identity boundary
        shell: bash
        run: |
          set -euo pipefail
          HUB="https://www.millionsnest.com"

          GRANT_STATUS="$(curl --silent --show-error \
            -o /tmp/hub-channel-grant.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"channel":"whatsapp","channelIdentityRef":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","organizationId":"release-smoke"}' \
            "$HUB/api/ecosystem/connect/channel-grants")"
          test "$GRANT_STATUS" = "401"

          SESSION_STATUS="$(curl --silent --show-error \
            -o /tmp/hub-channel-session.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"channel":"whatsapp","grantRef":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","grantSecret":"invalidinvalidinvalidinvalidinvalidinvalid"}' \
            "$HUB/api/ecosystem/connect/channel-session")"
          test "$SESSION_STATUS" = "401" || test "$SESSION_STATUS" = "400"

          echo "CONNECT_WHATSAPP_HUB_CHANNEL_BOUNDARY_OK"

      - name: Validate Meta WABA and phone binding
        shell: bash
        run: |
          set -euo pipefail
          META_BASE="https://graph.facebook.com/$META_GRAPH_VERSION"

          STATUS="$(curl --silent --show-error             -o /tmp/meta-phone-numbers.json -w '%{http_code}'             -H "Authorization: Bearer $META_ACCESS_TOKEN"             "$META_BASE/$META_WABA_ID/phone_numbers?fields=id&limit=100")"
          test "$STATUS" = "200"

          META_PHONE_NUMBER_ID="$META_PHONE_NUMBER_ID" node - <<'NODE'
          const fs = require('fs');
          const expected = process.env.META_PHONE_NUMBER_ID;
          const body = JSON.parse(fs.readFileSync('/tmp/meta-phone-numbers.json', 'utf8'));
          const ids = Array.isArray(body.data) ? body.data.map((x) => String(x?.id || '')) : [];
          if (!ids.includes(expected)) throw new Error('META_PHONE_NUMBER_NOT_IN_WABA');
          console.log('CONNECT_WHATSAPP_META_PHONE_BINDING_OK');
          NODE

          STATUS="$(curl --silent --show-error             -o /tmp/meta-subscribe.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer $META_ACCESS_TOKEN"             "$META_BASE/$META_WABA_ID/subscribed_apps")"
          test "$STATUS" -ge 200
          test "$STATUS" -lt 300
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/meta-subscribe.json', 'utf8'));
          if (body.success !== true) throw new Error('META_WABA_APP_SUBSCRIPTION_FAILED');
          console.log('CONNECT_WHATSAPP_META_APP_SUBSCRIBED');
          NODE

      - name: Activate official WhatsApp on Connect Core
        shell: bash
        run: |
          set -euo pipefail

          PREVIOUS_REVISION="$(gcloud run services describe "$SERVICE"             --project "$PROJECT_ID"             --region "$REGION"             --format='value(status.latestReadyRevisionName)')"
          test -n "$PREVIOUS_REVISION"

          BINDINGS="$(node -e 'process.stdout.write(JSON.stringify([{organizationId:process.env.CONNECT_ORGANIZATION_ID,phoneNumberId:process.env.META_PHONE_NUMBER_ID,connectionRef:process.env.CONNECT_CONNECTION_REF,enabled:true}]))')"

          rollback() {
            echo "::warning::WhatsApp activation verification failed; routing traffic back to $PREVIOUS_REVISION"
            gcloud run services update-traffic "$SERVICE"               --project "$PROJECT_ID"               --region "$REGION"               --to-revisions="$PREVIOUS_REVISION=100"               --quiet || true
          }
          trap rollback ERR

          gcloud run services update "$SERVICE"             --project "$PROJECT_ID"             --region "$REGION"             --update-env-vars "^@^CONNECT_WHATSAPP_WEBHOOK_ENABLED=true@CONNECT_WHATSAPP_WEBHOOK_VERIFY_TOKEN=$META_VERIFY_TOKEN@CONNECT_WHATSAPP_APP_SECRET=$META_APP_SECRET@CONNECT_WHATSAPP_ACCESS_TOKEN=$META_ACCESS_TOKEN@CONNECT_WHATSAPP_GRAPH_API_VERSION=$META_GRAPH_VERSION@CONNECT_WHATSAPP_PHONE_NUMBER_ID=$META_PHONE_NUMBER_ID@CONNECT_WHATSAPP_CONNECTIONS_JSON=$BINDINGS@CONNECT_WHATSAPP_INGESTION_ENABLED=true@CONNECT_INBOX_HUMAN_REPLY_ENABLED=true@CONNECT_WHATSAPP_PROVIDER_DISPATCH_ENABLED=true@CONNECT_WHATSAPP_REPLY_POLICY_ACK=CONNECT_WHATSAPP_REPLY_POLICY_READY@CONNECT_WHATSAPP_ASSIST_ENABLED=true"             --quiet

          BASE="${PUBLIC_ORIGIN%/}"
          CALLBACK="$BASE/api/channels/whatsapp/webhook"

          CHALLENGE="connect-production-${GITHUB_RUN_ID}"
          VERIFY_BODY="$(curl --fail --silent --show-error --location             --retry 8 --retry-delay 2 --retry-all-errors             --get             --data-urlencode "hub.mode=subscribe"             --data-urlencode "hub.verify_token=$META_VERIFY_TOKEN"             --data-urlencode "hub.challenge=$CHALLENGE"             "$CALLBACK")"
          test "$VERIFY_BODY" = "$CHALLENGE"
          echo "CONNECT_WHATSAPP_WEBHOOK_CHALLENGE_OK"

          LINK_STATUS="$(curl --silent --show-error --location \
            --retry 4 --retry-delay 2 --retry-all-errors \
            -o /tmp/connect-channel-link-auth.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{}' \
            "$BASE/api/core/channel-link/confirm")"
          test "$LINK_STATUS" = "401"
          echo "CONNECT_WHATSAPP_ASSIST_LINK_GATE_OK"

          printf '%s' '{"object":"whatsapp_business_account","entry":[]}' > /tmp/meta-webhook-smoke.json
          SIGNATURE="$(node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/meta-webhook-smoke.json');
          process.stdout.write('sha256=' + crypto.createHmac('sha256', process.env.META_APP_SECRET).update(body).digest('hex'));
          NODE
          )"

          STATUS="$(curl --silent --show-error --location             --retry 8 --retry-delay 2 --retry-all-errors             -o /tmp/meta-webhook-response.json -w '%{http_code}'             -X POST             -H 'Content-Type: application/json'             -H "X-Hub-Signature-256: $SIGNATURE"             --data-binary @/tmp/meta-webhook-smoke.json             "$CALLBACK")"
          test "$STATUS" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/meta-webhook-response.json', 'utf8'));
          if (x.success !== true || x.accepted !== 0) throw new Error('WHATSAPP_SIGNED_WEBHOOK_SMOKE_FAILED');
          console.log('CONNECT_WHATSAPP_SIGNED_WEBHOOK_OK');
          NODE

          curl --fail --silent --show-error --location             --retry 8 --retry-delay 2 --retry-all-errors             "$BASE/api/health/storage-readiness" -o /tmp/connect-storage-after.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/connect-storage-after.json', 'utf8'));
          if (x.success !== true || x.storageReadiness !== 'read_write_confirmed') {
            throw new Error('CONNECT_STORAGE_REGRESSED_AFTER_WHATSAPP_ACTIVATION');
          }
          NODE

          trap - ERR
          echo "CONNECT_WHATSAPP_ASSIST_ENABLED"
          echo "CONNECT_WHATSAPP_PRODUCTION_ACTIVATION_OK"
