name: Composer V2 Release Dispatcher

on:
  push:
    branches:
      - production
    paths:
      - 'src/personal/radar/composerPlaybook.ts'
      - 'src/personal/radar/personalRadarService.ts'
      - 'src/personal/radar/personalRadarHttp.ts'
      - 'src/core/client/personalRadarClient.ts'
      - 'src/features/radar/RadarPage.tsx'
      - 'src/tests/composerPlaybook.test.ts'
      - 'src/tests/personalRadarService.test.ts'
      - 'package.json'
      - '.github/workflows/composer-v2-release-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-certified-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch certified Connect production release in live mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run connect-core-production-release.yml \
            --repo "${{ github.repository }}" \
            --ref production \
            -f live_mode=true \
            -f live_activation_ack=CONNECT_LIVE_READY
          echo "CONNECT_COMPOSER_V2_RELEASE_DISPATCHED"
