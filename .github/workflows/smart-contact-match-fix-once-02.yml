name: Smart Contact Match Fix Once 02

on:
  push:
    branches:
      - feature/personal-sources-v2-relationship-memory
    paths:
      - .github/workflows/smart-contact-match-fix-once-02.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/personal-sources-v2-relationship-memory
      - name: Apply exact-phone identity enrichment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/personal/radar/personalRadarService.ts')
          s = p.read_text()
          a = "      let person = existing.find(item => phone && normalizedPhone(item.phone) === phone);\n      if (!person) person = existing.find(item => !item.phone && normalizedName(item.displayName) === nameKey);"
          b = """      let person = existing.find(item => phone && normalizedPhone(item.phone) === phone);
                let matchedByPhoneIdentity = Boolean(person && phone);
                if (!person && phone) {
                  person = existing.find(item => uniqueStrings(item.displayName, item.probableName, item.identityAliases)
                    .some(alias => normalizedPhone(alias) === phone));
                  matchedByPhoneIdentity = Boolean(person);
                }
                if (!person) person = existing.find(item => !item.phone && normalizedName(item.displayName) === nameKey);"""
          if a not in s: raise SystemExit('match anchor missing')
          s = s.replace(a, b, 1)
          a = "        displayName, phone: phone || person?.phone || null, sourceKinds,\n        signals: Array.isArray(person?.signals) && person!.signals.length ? person!.signals : [directSignal],"
          b = """        displayName, phone: phone || person?.phone || null, sourceKinds,
                identityAliases: uniqueStrings(person?.identityAliases, person?.displayName, person?.probableName, displayName),
                identityConfirmedAliases: matchedByPhoneIdentity
                  ? uniqueStrings(person?.identityConfirmedAliases, normalizeIdentityName(displayName), normalizeIdentityName(person?.displayName))
                  : person?.identityConfirmedAliases,
                identityResolution: matchedByPhoneIdentity ? 'contact_phone_confirmed' : person?.identityResolution,
                identityConfidence: matchedByPhoneIdentity ? 100 : person?.identityConfidence,
                probableName: matchedByPhoneIdentity ? null : person?.probableName,
                signals: Array.isArray(person?.signals) && person!.signals.length ? person!.signals : [directSignal],"""
          if a not in s: raise SystemExit('write anchor missing')
          p.write_text(s.replace(a, b, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/personal/radar/personalRadarService.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: enrich WhatsApp phone identities from imported contacts"
          git push origin HEAD:feature/personal-sources-v2-relationship-memory
