name: Source-aware identity one-shot

on:
  push:
    branches:
      - feat/source-aware-identity-intelligence-01
    paths:
      - .github/workflows/source-aware-identity-one-shot.yml

permissions:
  contents: write

concurrency:
  group: source-aware-identity-one-shot
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation
        run: node scripts/apply-source-aware-identity.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify focused Radar behavior
        run: |
          npm run lint
          npm run test:radar-pilot
          npm run build
      - name: Commit verified implementation and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-source-aware-identity.mjs
          rm -f .github/workflows/source-aware-identity-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Connect: source-aware imports and explainable probable identities"
          git push origin HEAD:feat/source-aware-identity-intelligence-01
