name: Connect Production Recovery Invoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: connect-recovery-protected-production-run
  cancel-in-progress: false

jobs:
  invoke:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com
      - name: Prove exact serving state and invoke existing signed Cloud Run Job
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=millionsnest
          REGION=us-central1
          JOB=connect-inbound-alert-recovery-v1
          curl --fail --silent --show-error --max-time 20 --proto '=https' \
            -H 'Cache-Control: no-store' 'https://connect.millionsnest.com/api/health?recovery-verified=1' > /tmp/connect-recovery-live.json
          # Obtain the SHA from the canonical live Core; do not rely on a stale
          # hardcoded release hash. Accept it ONLY after independent protected
          # Cloud Run 100%-traffic revision, immutable image and policy proof.
          EXPECTED_CORE_SHA="$(node - <<'NODE'
          const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/connect-recovery-live.json','utf8'));
          if(h.success!==true||h.service!=='millionsnest-connect-core'||!(/^[a-f0-9]{40}$/.test(h.releaseSha||''))) process.exit(1);
          process.stdout.write(h.releaseSha);
          NODE
          )"
          export EXPECTED_CORE_SHA
          gcloud run services describe connect-api --project "$PROJECT" --region "$REGION" --format=json > /tmp/connect-recovery-service.json
          SERVING_REVISION="$(node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/connect-recovery-service.json','utf8'));
          const matches=(d.status?.traffic||[]).filter(t=>Number(t.percent)===100&&typeof t.revisionName==='string');
          if(matches.length!==1||!/^connect-api-[a-z0-9-]+$/.test(matches[0].revisionName))process.exit(1);
          process.stdout.write(matches[0].revisionName);
          NODE
          )"
          gcloud run revisions describe "$SERVING_REVISION" --project "$PROJECT" --region "$REGION" --format=json > /tmp/connect-recovery-revision.json
          # Cloud Run resolves immutable image tags to digest in revision.spec.
          # Independently resolve the verified release SHA tag via Artifact
          # Registry; the serving digest MUST match that exact artifact.
          IMAGE_TAG="us-central1-docker.pkg.dev/millionsnest/millionsnest-web/connect-api:$EXPECTED_CORE_SHA"
          EXPECTED_IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" --project "$PROJECT" --format='value(image_summary.digest)')"
          [[ "$EXPECTED_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo RECOVERY_ARTIFACT_DIGEST_UNAVAILABLE >&2; exit 1; }
          export EXPECTED_IMAGE_DIGEST
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/connect-recovery-revision.json','utf8'));
          const c=d.spec?.containers?.[0]||{};
          const env=Object.fromEntries((c.env||[]).map(e=>[e.name,e.value]));
          const sha=process.env.EXPECTED_CORE_SHA;
          if(!d.status?.conditions?.some(v=>v.type==='Ready'&&v.status==='True'))process.exit(1);
          const registry='us-central1-docker.pkg.dev/millionsnest/millionsnest-web/connect-api';
          const digest=process.env.EXPECTED_IMAGE_DIGEST||'';
          if(env.CONNECT_RELEASE_SHA!==sha||!/^sha256:[a-f0-9]{64}$/.test(digest)||
             ![`${registry}:${sha}`,`${registry}@${digest}`].includes(c.image)) {
            console.error('RECOVERY_VERIFIED_SERVING_IMAGE_PROVENANCE_CHANGED'); process.exit(1);
          }
          if(env.CONNECT_INTERNAL_ALERT_QUEUE_ENABLED!=='true'||env.CONNECT_AUTOMATION_EXECUTION_ENABLED!=='false'||env.CONNECT_WEB_PUSH_ENABLED!=='false')process.exit(1);
          console.log('RECOVERY_PRODUCTION_LIVE_SHA_OK');
          console.log('RECOVERY_QUEUE_ONLY_FLAGS_OK');
          NODE
          gcloud run jobs describe "$JOB" --project "$PROJECT" --region "$REGION" --format=json > /tmp/connect-recovery-job.json
          node - <<'NODE'
          const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/connect-recovery-job.json','utf8'));
          const images=[j.spec?.template?.spec?.template?.spec?.containers?.[0]?.image,j.template?.template?.containers?.[0]?.image];
          if(!images.some(i=>typeof i==='string'&&i.endsWith('connect-api:'+process.env.EXPECTED_CORE_SHA))) process.exit(1);
          console.log('RECOVERY_PINNED_JOB_IMAGE_OK');
          NODE
          gcloud run jobs execute "$JOB" --project "$PROJECT" --region "$REGION" --wait --quiet
          echo RECOVERY_GITHUB_PROD_OIDC_SIGNED_JOB_OK
