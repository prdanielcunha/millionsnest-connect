name: Patch Relationship Intelligence V3 Once

on:
  push:
    branches:
      - feature/relationship-intelligence-v3
    paths:
      - .github/workflows/patch-relationship-intelligence-v3-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/relationship-intelligence-v3
      - name: Patch navigation, policy regression and Person 360 timeline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label} anchor missing in {path}')
              p.write_text(s.replace(old, new, 1))

          # Live navigation: Intelligence is now a real owner-private backend surface.
          replace_once(
              'src/components/layout/Shell.tsx',
              "const sourceLabels: Record<LanguageCode, string> = {\n  'pt-BR': 'Minhas fontes',\n  'en-US': 'My sources',\n  'es-ES': 'Mis fuentes',\n};\n",
              "const sourceLabels: Record<LanguageCode, string> = {\n  'pt-BR': 'Minhas fontes',\n  'en-US': 'My sources',\n  'es-ES': 'Mis fuentes',\n};\n\nconst intelligenceLabels: Record<LanguageCode, string> = {\n  'pt-BR': 'Inteligência',\n  'en-US': 'Intelligence',\n  'es-ES': 'Inteligencia',\n};\n",
              'intelligence labels',
          )
          replace_once(
              'src/components/layout/Shell.tsx',
              "      { id: 'radar', label: radarLabels[currentLang], icon: Radar },\n      { id: 'sources', label: sourceLabels[currentLang], icon: Database },\n",
              "      { id: 'radar', label: radarLabels[currentLang], icon: Radar },\n      { id: 'sources', label: sourceLabels[currentLang], icon: Database },\n      { id: 'intelligence', label: intelligenceLabels[currentLang], icon: BrainCircuit },\n",
              'intelligence nav item',
          )

          # Policy regression now expects the real Intelligence surface too.
          replace_once(
              'src/tests/liveSurfacePolicy.test.ts',
              "equal(getLiveNavigationRouteIds(true), ['overview', 'radar', 'sources'], 'governance live users see real Core, Radar and Personal Sources surfaces');",
              "equal(getLiveNavigationRouteIds(true), ['overview', 'radar', 'sources', 'intelligence'], 'governance live users see Core, Radar, Personal Sources and Relationship Intelligence surfaces');",
              'live surface expected list',
          )
          replace_once(
              'src/tests/liveSurfacePolicy.test.ts',
              "ok(isLiveRouteEnabled('sources', true), 'Personal Sources is live for governance users');",
              "ok(isLiveRouteEnabled('sources', true), 'Personal Sources is live for governance users');\nok(isLiveRouteEnabled('intelligence', true), 'Relationship Intelligence is live for governance users');",
              'intelligence live assertion',
          )

          # Radar client exposes the unified timeline so Person360 can stay session-agnostic.
          p = Path('src/core/client/personalRadarClient.ts')
          s = p.read_text()
          anchor = "\n  async search(query: string) {"
          method = """

  async getPersonTimeline(personId: string, limit = 240) {
    const url = new URL(`/api/personal/intelligence/people/${encodeURIComponent(personId)}/timeline`, window.location.origin);
    url.searchParams.set('limit', String(limit));
    const response = await fetch(url.toString(), { method: 'GET', headers: this.headers(), cache: 'no-store' });
    return parseResponse(response);
  }
"""
          if anchor not in s:
              raise SystemExit('personal radar client search anchor missing')
          p.write_text(s.replace(anchor, method + anchor, 1))

          # Person 360 gets a real cross-source timeline, preserving the old recent-message fallback.
          p = Path('src/features/contacts/Person360Panel.tsx')
          s = p.read_text()
          old = """    client.getPersonContext(personId)
      .then(result => { if (active) setData(result); })
      .catch(e => { if (active) setError(e instanceof Error ? e.message : 'Error'); })
      .finally(() => { if (active) setLoading(false); });"""
          new = """    Promise.all([client.getPersonContext(personId), client.getPersonTimeline(personId, 240)])
      .then(([result, timeline]) => { if (active) setData({ ...result, timeline: Array.isArray(timeline.items) ? timeline.items : [] }); })
      .catch(e => { if (active) setError(e instanceof Error ? e.message : 'Error'); })
      .finally(() => { if (active) setLoading(false); });"""
          if old not in s:
              raise SystemExit('Person360 loading anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace(
              "    recent: 'Mensagens recentes desta pessoa', evidence: 'Evidências de identidade', signals: 'Sinais explicáveis',",
              "    recent: 'Timeline unificada', evidence: 'Evidências de identidade', signals: 'Sinais explicáveis',",
              1,
          )
          s = s.replace(
              "    recent: 'Mensajes recientes de esta persona', evidence: 'Evidencias de identidad', signals: 'Señales explicables',",
              "    recent: 'Timeline unificada', evidence: 'Evidencias de identidad', signals: 'Señales explicables',",
              1,
          )
          s = s.replace(
              "    recent: 'Recent messages from this person', evidence: 'Identity evidence', signals: 'Explainable signals',",
              "    recent: 'Unified timeline', evidence: 'Identity evidence', signals: 'Explainable signals',",
              1,
          )
          s = s.replace(
              "  const messages = Array.isArray(data?.recentMessages) ? data.recentMessages : [];",
              "  const messages = Array.isArray(data?.timeline) && data.timeline.length ? data.timeline : Array.isArray(data?.recentMessages) ? data.recentMessages : [];",
              1,
          )
          old = """{messages.slice(0, 18).map((message: any, index: number) => <div key={`${message.timestampLocal || message.dateKey}-${index}`} className=\"rounded-xl border border-white/6 bg-black/15 p-3\"><div className=\"text-[10px] font-medium text-slate-500\">{shortDate(message.dateKey || message.timestampLocal, currentLang)}</div><p className=\"mt-1 text-xs leading-5 text-slate-300\">{message.text}</p></div>)}"""
          new = """{messages.slice(0, 30).map((message: any, index: number) => <div key={`${message.timestampLocal || message.dateKey}-${index}`} className=\"rounded-xl border border-white/6 bg-black/15 p-3\"><div className=\"flex flex-wrap items-center justify-between gap-2 text-[10px] font-medium text-slate-500\"><span>{shortDate(message.dateKey || message.timestampLocal, currentLang)}</span><span className=\"text-slate-600\">{message.sourceLabel || (message.type === 'follow_up' ? 'Connect' : '')}</span></div><p className=\"mt-1 text-xs leading-5 text-slate-300\">{message.type === 'follow_up' ? `Follow-up · ${message.text}` : message.text}</p></div>)}"""
          if old not in s:
              raise SystemExit('Person360 message render anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit integration patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/Shell.tsx src/tests/liveSurfacePolicy.test.ts src/core/client/personalRadarClient.ts src/features/contacts/Person360Panel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate intelligence navigation and unified timeline"
          git push origin HEAD:feature/relationship-intelligence-v3
