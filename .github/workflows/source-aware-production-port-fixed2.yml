name: Source-aware production port fixed2

on:
  push:
    branches:
      - release/source-aware-identity-production-01
    paths:
      - .github/workflows/source-aware-production-port-fixed2.yml

permissions:
  contents: write

jobs:
  port-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: release/source-aware-identity-production-01
      - name: Extract and run reviewed port script
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/source-aware-production-port-fixed.yml | sed '1d;$d;s/^          //' > /tmp/source-aware-port.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/source-aware-port.py')
          text = path.read_text()
          old = "    if count != 1:\n        raise RuntimeError(f'{label}: expected 1 anchor, found {count}')"
          new = "    if count < 1:\n        raise RuntimeError(f'{label}: expected at least 1 anchor, found {count}')"
          if old not in text:
              raise SystemExit('replace helper anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          python /tmp/source-aware-port.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify port
        run: |
          npm run lint
          npm run test:radar-pilot
          npm run test:core-http
          npm run test:zerocost
          npm run test:gatewaytenant
          npm run test:authority
          npm run test:chartdelivery
          npm run test:firebase-hosting
          npm run test:release-policy
          npm run build
          npm run build:core
      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "Connect: port source-aware imports to production"
          git push origin HEAD:release/source-aware-identity-production-01
