name: Composer Editable Context Release Apply

on:
  push:
    branches:
      - release/composer-editable-context-01
    paths:
      - .github/workflows/composer-editable-release-apply.yml

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/composer-editable-context-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply verified main hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git cherry-pick 6868c26f483b0630bf6d9c09b6064b8209d8977a
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify release
        run: |
          npm run lint
          npm run test:radar-pilot
          npm run test:release-policy
          npm run build
          npm run build:core
      - name: Remove one-shot helper and publish release branch
        run: |
          git rm .github/workflows/composer-editable-release-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Composer editable-context release helper"
          git push origin HEAD:release/composer-editable-context-01
