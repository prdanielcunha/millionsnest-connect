name: Relationship Brain V4 Main Once

on:
  push:
    branches:
      - feature/relationship-brain-v4-main
    paths:
      - .github/workflows/relationship-brain-v4-main-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/relationship-brain-v4-main
      - name: Apply main port
        run: |
          python .github/scripts/relationship_brain_v4_main_patch.py
          python .github/scripts/relationship_brain_v4_main_fix.py
      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run test:radar-pilot
          npm run build
          npm run build:core
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/client/whatsappDelivery.ts src/core/client/personalRadarClient.ts src/personal/radar/composerPlaybook.ts src/personal/radar/personalRadarService.ts src/features/radar/RadarPage.tsx src/features/sources/PersonalSourcesPage.tsx src/tests/composerPlaybook.test.ts
          git commit -m "feat: port Relationship Brain V4 and universal WhatsApp handoff"
          git push origin HEAD:feature/relationship-brain-v4-main
