name: Radar Priority Release Dispatcher

on:
  push:
    branches:
      - production
    paths:
      - 'src/personal/radar/radarSignals.ts'
      - 'src/features/radar/RadarPage.tsx'
      - 'src/tests/personalRadarSignals.test.ts'
      - '.github/workflows/radar-priority-release-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-certified-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch certified Connect production release in live mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run connect-core-production-release.yml \
            --repo "${{ github.repository }}" \
            --ref production \
            -f live_mode=true \
            -f live_activation_ack=CONNECT_LIVE_READY
          echo "CONNECT_RADAR_PRIORITY_RELEASE_DISPATCHED"
