name: Activate Private Radar Live Once

on:
  push:
    branches:
      - production
    paths:
      - .github/workflows/activate-radar-live-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Verify certified Radar release gates are on production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/${{ github.repository }}/contents/.github/workflows/connect-core-production-release.yml?ref=production" \
            --jq .content | base64 -d >/tmp/connect-release.yml
          grep -F 'RUNTIME_SA: mn-connect-runtime@millionsnest.iam.gserviceaccount.com' /tmp/connect-release.yml
          grep -F -- '--service-account "$RUNTIME_SA"' /tmp/connect-release.yml
          grep -F 'npm run test:radar-pilot' /tmp/connect-release.yml

          gh api "repos/${{ github.repository }}/contents/package.json?ref=production" \
            --jq .content | base64 -d >/tmp/package.json
          grep -F '"test:radar-pilot"' /tmp/package.json

          gh api "repos/${{ github.repository }}/contents/src/features/radar/RadarPage.tsx?ref=production" \
            --jq .sha >/tmp/radar-page-sha.txt
          test -s /tmp/radar-page-sha.txt

          echo "CONNECT_PRIVATE_RADAR_RELEASE_GATES_PRESENT"

      - name: Dispatch canonical guarded live release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run connect-core-production-release.yml \
            --repo "${{ github.repository }}" \
            --ref production \
            -f live_mode=true \
            -f live_activation_ack=CONNECT_LIVE_READY
          echo "CONNECT_PRIVATE_RADAR_CANONICAL_RELEASE_DISPATCHED"
