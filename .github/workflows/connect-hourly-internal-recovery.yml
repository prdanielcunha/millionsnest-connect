name: Connect Free Hourly Recovery
# The default-branch cron has NO GCP identity. Production-only WIF rejects
# main, so it dispatches an isolated workflow on the protected production ref.
# A successful main dispatch ONLY proves the request was accepted; inspect
# the separately protected production invoke result before asserting recovery.
# This tracked comment change initiates a real main→production dispatch smoke
# on merge, with no additional GCP credentials, IAM or service mutations.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-hourly-internal-recovery.yml'
      - '.github/workflows/connect-production-recovery-invoke.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: connect-recovery-hourly-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request bounded signed worker on protected production ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$REPO" = prdanielcunha/millionsnest-connect
          # GitHub workflow_dispatch is an allowed GITHUB_TOKEN workflow trigger.
          # This runner cannot obtain GCP credentials or access HMAC secrets.
          gh api --method POST "/repos/$REPO/actions/workflows/connect-production-recovery-invoke.yml/dispatches" \
            -f ref=production
          echo CONNECT_PRODUCTION_RECOVERY_DISPATCH_ACCEPTED
