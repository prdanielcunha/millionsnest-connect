name: People Mobile Composer Fix

on:
  push:
    branches:
      - feature/people-mobile-composer-fix-01
    paths:
      - .github/workflows/people-mobile-composer-fix.yml
      - .github/scripts/apply_people_mobile_composer_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/people-mobile-composer-fix-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply People mobile Composer fix
        run: python3 .github/scripts/apply_people_mobile_composer_fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate
        run: |
          npm run lint
          npm run test:radar-pilot
          npm run test:core-http
          npm run test:firebase-hosting
          npm run test:release-policy
          npm run build
          npm run build:core
      - name: Commit verified product changes and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/people-mobile-composer-fix.yml .github/scripts/apply_people_mobile_composer_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/contacts/LivePeoplePage.tsx .github/workflows/people-mobile-composer-fix.yml .github/scripts/apply_people_mobile_composer_fix.py
          git commit -m "Fix People mobile composer flow"
          git push origin HEAD:feature/people-mobile-composer-fix-01
