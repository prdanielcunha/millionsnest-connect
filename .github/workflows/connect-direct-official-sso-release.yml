name: Connect Direct Official SSO Release

on:
  push:
    branches:
      - production
    paths:
      - .github/workflows/connect-direct-official-sso-release.yml
      - .github/workflows/connect-core-production-release.yml
      - .github/workflows/connect-whatsapp-production-activation.yml
      - public/connect-auth.js
      - src/core/client/connectDirectAuth.ts
      - src/core/client/connectNestAiClient.ts
      - src/features/inbox/LiveInboxPage.tsx
      - src/tests/inboxMobile.test.ts
      - package.json
      - package-lock.json
      - millionsnest.app.json

permissions:
  contents: read

jobs:
  coordinate:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm native production release ownership
        run: |
          set -euo pipefail
          echo "CONNECT_CORE_AUTO_RELEASE_NATIVE"
          echo "The Core production workflow is triggered directly by this production push; no duplicate workflow dispatch is required."
