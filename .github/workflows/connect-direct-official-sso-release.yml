name: Connect Direct Official SSO Release
# Cloud Run traffic recovery certified release trigger — 2026-10-06

on:
  push:
    branches:
      - production
    paths:
      - .github/workflows/connect-direct-official-sso-release.yml
      - .github/workflows/connect-core-production-release.yml
      - .github/workflows/connect-whatsapp-production-activation.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch certified Connect production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run connect-core-production-release.yml \
            --repo "${{ github.repository }}" \
            --ref production \
            -f live_mode=true \
            -f live_activation_ack=CONNECT_LIVE_READY
