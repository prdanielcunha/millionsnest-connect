name: Port Relationship Intelligence V3 Production Once

on:
  push:
    branches:
      - release/relationship-intelligence-v3
    paths:
      - .github/workflows/port-relationship-intelligence-v3-prod-once.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/relationship-intelligence-v3
          fetch-depth: 0
      - name: Copy certified architecture-neutral V3 files from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p src/personal/intelligence src/features/intelligence src/core/client src/tests
          for path in \
            src/personal/intelligence/personalIntelligenceService.ts \
            src/personal/intelligence/personalIntelligenceHttp.ts \
            src/core/client/personalIntelligenceClient.ts \
            src/features/intelligence/RelationshipIntelligencePage.tsx \
            src/tests/personalIntelligenceService.test.ts \
            src/server/createConnectServer.ts; do
            git show origin/main:"$path" > "$path"
          done
      - name: Adapt V3 to production-only Smart Contacts and People surfaces
        run: python .github/scripts/port_relationship_intelligence_v3_prod.py
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
      - name: Commit production V3 port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            src/App.tsx \
            src/components/layout/Shell.tsx \
            src/core/client/liveSurfacePolicy.ts \
            src/core/client/personalIntelligenceClient.ts \
            src/core/client/personalRadarClient.ts \
            src/features/contacts/Person360Panel.tsx \
            src/features/intelligence/RelationshipIntelligencePage.tsx \
            src/personal/intelligence/personalIntelligenceHttp.ts \
            src/personal/intelligence/personalIntelligenceService.ts \
            src/server/createConnectServer.ts \
            src/tests/liveSurfacePolicy.test.ts \
            src/tests/personalIntelligenceService.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: port Relationship Intelligence V3 to production"
          git push origin HEAD:release/relationship-intelligence-v3
