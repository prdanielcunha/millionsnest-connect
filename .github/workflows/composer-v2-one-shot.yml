name: Composer V2 One Shot

on:
  push:
    branches:
      - feature/composer-playbook-v2-01
    paths:
      - .github/workflows/composer-v2-one-shot.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/composer-playbook-v2-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply source-defined Composer v2
        run: node scripts/apply-composer-v2.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run lint
      - name: Verify Radar and Composer
        run: npm run test:radar-pilot
      - name: Verify production policy
        run: npm run test:release-policy
      - name: Build frontend
        run: npm run build
      - name: Build Core
        run: npm run build:core
      - name: Commit verified implementation
        run: |
          rm scripts/apply-composer-v2.mjs .github/workflows/composer-v2-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/personal/radar/composerPlaybook.ts src/personal/radar/personalRadarService.ts src/personal/radar/personalRadarHttp.ts src/core/client/personalRadarClient.ts src/features/radar/RadarPage.tsx src/tests/composerPlaybook.test.ts package.json scripts/apply-composer-v2.mjs .github/workflows/composer-v2-one-shot.yml
          git commit -m "Implement guided MusicScale Composer playbook"
          git push origin HEAD:feature/composer-playbook-v2-01
