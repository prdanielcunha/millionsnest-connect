name: Connect Live Bootstrap Release Once

on:
  push:
    branches:
      - production
    paths:
      - '.github/workflows/connect-live-bootstrap-release-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: connect-core-production-release
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  REGION: us-central1
  SERVICE: connect-api
  REPOSITORY: millionsnest-web
  RUNTIME_SA: mn-connect-runtime@millionsnest.iam.gserviceaccount.com
  IMAGE: us-central1-docker.pkg.dev/millionsnest/millionsnest-web/connect-api:${{ github.sha }}
  VITE_FIREBASE_API_KEY: AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs

jobs:
  release:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Prove live upstream routes
        shell: bash
        run: |
          set -euo pipefail
          HUB_STATUS="$(curl --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors -o /tmp/hub.json -w '%{http_code}' 'https://www.millionsnest.com/api/ecosystem/connect/session-context?organizationId=release-smoke')"
          test "$HUB_STATUS" = "401"
          MUSIC_STATUS="$(curl --silent --show-error --location --retry 6 --retry-delay 2 --retry-all-errors -o /tmp/music.json -w '%{http_code}' 'https://musicscale.millionsnest.com/api/v1/connect/next-schedule')"
          test "$MUSIC_STATUS" = "401"
          echo "CONNECT_LIVE_UPSTREAM_ROUTE_PROOFS_OK"

      - name: Validate frontend and Core
        env:
          VITE_CONNECT_LIVE_ENABLED: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run test:core-http
          npm run test:radar-pilot
          npm run test:zerocost
          npm run test:gatewaytenant
          npm run test:authority
          npm run test:chartdelivery
          npm run test:firebase-hosting
          npm run test:release-policy
          npm run build
          npm run build:core

      - name: Build and smoke Core container locally
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile.core -t connect-api:release .
          docker run -d --rm --name connect-core-release-smoke -e PORT=8080 -e MILLIONSNEST_HUB_ORIGIN=https://www.millionsnest.com -e MUSICSCALE_ORIGIN=https://musicscale.millionsnest.com -p 18083:8080 connect-api:release
          trap 'docker stop connect-core-release-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18083/api/health >/tmp/connect-health.json; then
              node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-health.json','utf8'));if(x.success!==true||x.service!=='millionsnest-connect-core')process.exit(1)"
              echo "CONNECT_CORE_LOCAL_RELEASE_SMOKE_OK"
              exit 0
            fi
            sleep 1
          done
          docker logs connect-core-release-smoke
          exit 1

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Verify production dependencies
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$REPOSITORY" --project "$PROJECT_ID" --location "$REGION" --format='value(name)' >/tmp/repo.txt
          test -s /tmp/repo.txt
          test "$(gcloud iam service-accounts describe "$RUNTIME_SA" --project "$PROJECT_ID" --format='value(email)')" = "$RUNTIME_SA"

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push immutable production image
        run: |
          docker build -f Dockerfile.core -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Connect Core revision
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SA" \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 40 \
            --timeout 60 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,MILLIONSNEST_HUB_ORIGIN=https://www.millionsnest.com,MUSICSCALE_ORIGIN=https://musicscale.millionsnest.com" \
            --quiet

      - name: Verify Cloud Run readiness
        run: |
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='table(metadata.name,status.url,status.latestReadyRevisionName,status.conditions[0].type,status.conditions[0].status)'

      - name: Deploy Connect Firebase Hosting with live UI
        env:
          VITE_CONNECT_LIVE_ENABLED: 'true'
        run: |
          npm run build
          npx -y firebase-tools@15.26.0 deploy --only hosting:connect --project "$PROJECT_ID" --non-interactive

      - name: Production smoke through Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mn-connect-555464791734.web.app"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors "$BASE/" -o /tmp/connect-index.html
          grep -Eiq '<!doctype html|<html' /tmp/connect-index.html
          curl --fail --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors "$BASE/api/health" -o /tmp/connect-health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-health.json','utf8'));if(x.success!==true||x.service!=='millionsnest-connect-core')process.exit(1)"
          MESSAGE_STATUS="$(curl --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors -o /tmp/msg.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{\"text\":\"Qual é minha próxima escala?\"}' "$BASE/api/core/message")"
          test "$MESSAGE_STATUS" = "401"
          SESSION_STATUS="$(curl --silent --show-error --location --retry 12 --retry-delay 3 --retry-all-errors -o /tmp/session.json -w '%{http_code}' "$BASE/api/core/session?organizationId=release-smoke")"
          test "$SESSION_STATUS" = "401"
          echo "CONNECT_LIVE_BOOTSTRAP_HOTFIX_PRODUCTION_RELEASE_OK"
