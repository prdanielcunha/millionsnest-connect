name: Cloud Message Models Patch

on:
  push:
    branches:
      - feature/firebase-cloud-message-models-01
    paths:
      - .github/workflows/cloud-message-models-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/firebase-cloud-message-models-01
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Apply Firebase cloud model patch
        run: python3 .github/scripts/apply_cloud_message_models.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate
        run: |
          npm run lint
          npm run test:core-http
          npm run test:radar-pilot
          npm run test:zerocost
          npm run test:gatewaytenant
          npm run test:authority
          npm run test:chartdelivery
          npm run test:firebase-hosting
          npm run test:release-policy
          npm run build
          npm run build:core

      - name: Commit verified product changes and remove one-shot patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cloud-message-models-patch.yml .github/scripts/apply_cloud_message_models.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist People message models in Firebase"
          git push origin HEAD:feature/firebase-cloud-message-models-01
