name: Connect Direct Official SSO

on:
  push:
    branches:
      - feature/connect-direct-official-sso-01
    paths:
      - .github/workflows/connect-direct-official-sso.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/connect-direct-official-sso-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Apply direct SSO bridge
        run: python .github/scripts/apply_connect_direct_official_sso.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate
        run: |
          npm run lint
          npm run test:core-http
          npm run test:firebase-hosting
          npm run test:release-policy
          npm run build
          npm run build:core
      - name: Commit verified product changes and remove one-shot files
        run: |
          rm .github/workflows/connect-direct-official-sso.yml
          rm .github/scripts/apply_connect_direct_official_sso.py
          rm -rf dist dist-core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable direct Connect access through secure Hub SSO"
          git push origin HEAD:feature/connect-direct-official-sso-01
