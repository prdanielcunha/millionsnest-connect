name: Patch Relationship Intelligence V3 Run
on:
  push:
    branches: [feature/relationship-intelligence-v3]
    paths: [.github/workflows/patch-relationship-intelligence-v3-run.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/relationship-intelligence-v3
      - run: python .github/scripts/patch_relationship_intelligence_v3.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/Shell.tsx src/tests/liveSurfacePolicy.test.ts src/core/client/personalRadarClient.ts src/features/contacts/Person360Panel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate intelligence navigation and unified timeline"
          git push origin HEAD:feature/relationship-intelligence-v3
