name: Fix Composer Continuity Once

on:
  push:
    branches:
      - fix/composer-conversation-continuity
    paths:
      - .github/workflows/fix-composer-continuity-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/composer-conversation-continuity
      - name: Apply continuity patch
        run: python .github/scripts/fix_composer_continuity.py
      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run test:radar-pilot
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/personal/radar/composerPlaybook.ts src/features/radar/RadarPage.tsx src/tests/composerPlaybook.test.ts
          git commit -m "fix: make composer continue existing conversations"
          git push origin HEAD:fix/composer-conversation-continuity
