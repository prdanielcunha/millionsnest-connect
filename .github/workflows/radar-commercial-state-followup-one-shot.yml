name: Radar Commercial State Follow-up One Shot

on:
  push:
    branches:
      - fix/radar-commercial-state-followup-01
    paths:
      - .github/workflows/radar-commercial-state-followup-one-shot.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/radar-commercial-state-followup-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply persistent commercial state and follow-up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Client model + API payload
          p=Path('src/core/client/personalRadarClient.ts'); s=p.read_text()
          s=s.replace("  priority?: number;\n  signals:", "  priority?: number;\n  salesStage?: string | null;\n  lastCommercialAction?: 'whatsapp_opened' | 'sent_manual' | 'copied' | null;\n  lastCommercialAt?: string | null;\n  followUpAt?: string | null;\n  signals:")
          s=s.replace("      snoozeDays?: number;\n    },", "      snoozeDays?: number;\n      salesStage?: 'iniciar_conversa' | 'descobrir_dor' | 'contar_historia' | 'pedir_video' | 'enviar_video' | 'diagnosticar' | 'explicar_dor' | 'convidar_trial' | 'acompanhar_trial' | 'retomar_conversa' | 'fechar';\n      commercialAction?: 'whatsapp_opened' | 'sent_manual' | 'copied';\n      followUpDays?: number;\n    },")
          p.write_text(s)

          # Service persistence + due follow-up ordering + promotion metadata
          p=Path('src/personal/radar/personalRadarService.ts'); s=p.read_text()
          marker="function resolveSnoozeDays(value: unknown): number {\n  const days = value === undefined ? 7 : Number(value);\n  if (!Number.isInteger(days) || days < 1 || days > 90) throw new Error('SNOOZE_DAYS_INVALID');\n  return days;\n}\n"
          extra="""
const SALES_STAGES = new Set<ComposerObjective>([
  'iniciar_conversa', 'descobrir_dor', 'contar_historia', 'pedir_video', 'enviar_video',
  'diagnosticar', 'explicar_dor', 'convidar_trial', 'acompanhar_trial', 'retomar_conversa', 'fechar',
]);
const COMMERCIAL_ACTIONS = new Set(['whatsapp_opened', 'sent_manual', 'copied']);

function resolveFollowUpDays(value: unknown): number {
  const days = value === undefined ? 2 : Number(value);
  if (!Number.isInteger(days) || days < 1 || days > 90) throw new Error('FOLLOW_UP_DAYS_INVALID');
  return days;
}

function isFollowUpDue(person: Record<string, unknown>, nowMs: number): boolean {
  const at = Date.parse(String(person.followUpAt || ''));
  return Number.isFinite(at) && at <= nowMs;
}
"""
          if marker not in s: raise SystemExit('snooze marker missing')
          s=s.replace(marker, marker+extra, 1)
          old="""      .sort((a, b) => {
        const rank = Number(a.priority ?? 99) - Number(b.priority ?? 99);
        if (rank !== 0) return rank;
        return String(b.lastDateKey || '').localeCompare(String(a.lastDateKey || ''));
      });"""
          new="""      .sort((a, b) => {
        const dueRank = Number(!isFollowUpDue(a, nowMs)) - Number(!isFollowUpDue(b, nowMs));
        if (dueRank !== 0) return dueRank;
        const followUpRank = String(a.followUpAt || '').localeCompare(String(b.followUpAt || ''));
        if (isFollowUpDue(a, nowMs) && followUpRank !== 0) return followUpRank;
        const rank = Number(a.priority ?? 99) - Number(b.priority ?? 99);
        if (rank !== 0) return rank;
        return String(b.lastDateKey || '').localeCompare(String(a.lastDateKey || ''));
      });"""
          if old not in s: raise SystemExit('sort marker missing')
          s=s.replace(old,new,1)
          s=s.replace("""      snoozeDays?: number;
    },""", """      snoozeDays?: number;
      salesStage?: ComposerObjective;
      commercialAction?: 'whatsapp_opened' | 'sent_manual' | 'copied';
      followUpDays?: number;
    },""",1)
          anchor="""    let snoozedUntil = person.snoozedUntil || null;
    if (input.radarState === 'snoozed') {"""
          repl="""    if (input.salesStage !== undefined && !SALES_STAGES.has(input.salesStage)) throw new Error('SALES_STAGE_INVALID');
    if (input.commercialAction !== undefined && !COMMERCIAL_ACTIONS.has(input.commercialAction)) throw new Error('COMMERCIAL_ACTION_INVALID');

    const commercialAt = input.commercialAction ? isoNow(this.now) : (person.lastCommercialAt || null);
    let followUpAt = person.followUpAt || null;
    if (input.commercialAction === 'sent_manual') {
      const days = resolveFollowUpDays(input.followUpDays);
      followUpAt = new Date(this.now() + days * DAY_MS).toISOString();
    }

    let snoozedUntil = person.snoozedUntil || null;
    if (input.radarState === 'snoozed') {"""
          if anchor not in s: raise SystemExit('update anchor missing')
          s=s.replace(anchor,repl,1)
          s=s.replace("""        radarState,
        snoozedUntil,
        updatedAt: isoNow(this.now),""", """        radarState,
        snoozedUntil,
        salesStage: input.salesStage ?? person.salesStage ?? null,
        lastCommercialAction: input.commercialAction ?? person.lastCommercialAction ?? null,
        lastCommercialAt: commercialAt,
        followUpAt,
        updatedAt: isoNow(this.now),""",1)
          s=s.replace("""        phone: person.phone || null,
        organizationId: request.organizationId,
        status: 'open',""", """        phone: person.phone || null,
        organizationId: request.organizationId,
        salesStage: person.salesStage || null,
        lastCommercialAction: person.lastCommercialAction || null,
        lastCommercialAt: person.lastCommercialAt || null,
        followUpAt: person.followUpAt || null,
        status: 'open',""",1)
          p.write_text(s)

          # HTTP router exposes the new fields with safe validation in the service
          p=Path('src/personal/radar/personalRadarHttp.ts'); s=p.read_text()
          s=s.replace("""          snoozeDays: typeof body.snoozeDays === 'number' ? body.snoozeDays : undefined,
        },""", """          snoozeDays: typeof body.snoozeDays === 'number' ? body.snoozeDays : undefined,
          salesStage: typeof body.salesStage === 'string' ? body.salesStage as ComposerObjective : undefined,
          commercialAction: typeof body.commercialAction === 'string' ? body.commercialAction as any : undefined,
          followUpDays: typeof body.followUpDays === 'number' ? body.followUpDays : undefined,
        },""",1)
          s=s.replace("  if (code === 'SNOOZE_DAYS_INVALID') return 'Escolha um adiamento entre 1 e 90 dias.';", "  if (code === 'SNOOZE_DAYS_INVALID') return 'Escolha um adiamento entre 1 e 90 dias.';\n  if (code === 'FOLLOW_UP_DAYS_INVALID') return 'Escolha um acompanhamento entre 1 e 90 dias.';\n  if (code === 'SALES_STAGE_INVALID' || code === 'COMMERCIAL_ACTION_INVALID') return 'O estado comercial informado é inválido.';")
          p.write_text(s)

          # UI: resume persisted stage, track copy/open/send distinctly, show follow-up state.
          p=Path('src/features/radar/RadarPage.tsx'); s=p.read_text()
          s=s.replace("""    const initialObjective: ComposerObjective = signal.type === 'explicit_product_interest' ? 'descobrir_dor' : 'iniciar_conversa';""", """    const persistedObjective = SALES_STAGES.some(stage => stage.objective === person.salesStage) ? person.salesStage as ComposerObjective : null;
    const initialObjective: ComposerObjective = persistedObjective || (signal.type === 'explicit_product_interest' ? 'descobrir_dor' : 'iniciar_conversa');""")
          old="""  const openWhatsApp = (message: string, rawPhone?: string) => {
    const phone = normalizePhoneForUse(rawPhone);
    const url = phone
      ? `https://wa.me/${phone}?text=${encodeURIComponent(message)}`
      : `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank', 'noopener,noreferrer');
  };"""
          new="""  const persistCommercialState = async (personId: string, update: Parameters<PersonalRadarClient['updatePerson']>[1]) => {
    await client.updatePerson(personId, update);
    setPeople(prev => prev.map(person => person.id === personId ? { ...person, ...update } : person));
  };

  const openWhatsApp = async (message: string, rawPhone?: string) => {
    if (!selected) return;
    const phone = normalizePhoneForUse(rawPhone);
    await persistCommercialState(selected.person.id, { salesStage: composerObjective, commercialAction: 'whatsapp_opened' });
    const url = phone
      ? `https://wa.me/${phone}?text=${encodeURIComponent(message)}`
      : `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank', 'noopener,noreferrer');
  };

  const markManualSent = async () => {
    if (!selected) return;
    await persistCommercialState(selected.person.id, { salesStage: composerObjective, commercialAction: 'sent_manual', followUpDays: 2 });
    setNotice(currentLang === 'pt-BR' ? 'Envio manual registrado · acompanhamento em 2 dias.' : currentLang === 'es-ES' ? 'Envío manual registrado · seguimiento en 2 días.' : 'Manual send recorded · follow-up in 2 days.');
    await refresh();
  };"""
          if old not in s: raise SystemExit('whatsapp marker missing')
          s=s.replace(old,new,1)
          s=s.replace("""onClick={() => { setComposerObjective(stage.objective); void compose(selected, tone, composerStyle, stage.objective); }}""", """onClick={() => { setComposerObjective(stage.objective); void persistCommercialState(selected.person.id, { salesStage: stage.objective }); void compose(selected, tone, composerStyle, stage.objective); }}""")
          s=s.replace("""onClick={async () => { await navigator.clipboard.writeText(draft); setCopied(true); }}""", """onClick={async () => { await navigator.clipboard.writeText(draft); setCopied(true); if (selected) await persistCommercialState(selected.person.id, { salesStage: composerObjective, commercialAction: 'copied' }); }}""",1)
          s=s.replace("""onClick={() => openWhatsApp(draft, phone)}""", """onClick={() => void openWhatsApp(draft, phone)}""",1)
          # Add explicit manual-send confirmation next to WhatsApp action.
          target="""<MessageCircle size={16}/>{phone ? ui.directWhatsapp : ui.chooseWhatsapp}</button></div>"""
          replacement="""<MessageCircle size={16}/>{phone ? ui.directWhatsapp : ui.chooseWhatsapp}</button><button type=\"button\" onClick={() => void markManualSent()} disabled={!draft} className=\"inline-flex min-h-12 items-center justify-center gap-2 rounded-xl border border-emerald-400/25 bg-emerald-400/[0.07] px-3 text-sm font-semibold text-emerald-200 disabled:opacity-40\"><Check size={16}/>{currentLang === 'pt-BR' ? 'Marcar como enviado' : currentLang === 'es-ES' ? 'Marcar enviado' : 'Mark as sent'}</button></div>"""
          if target not in s: raise SystemExit('action row target missing')
          s=s.replace(target,replacement,1)
          # Current commercial state on each person card.
          target="""<div><h3 className=\"text-lg font-semibold text-white\">{person.displayName}</h3><p className=\"mt-1 text-xs text-slate-500\">{person.lastDateKey || '—'} · {person.messageCount || 0} {t.messages}</p></div>"""
          replacement="""<div><h3 className=\"text-lg font-semibold text-white\">{person.displayName}</h3><p className=\"mt-1 text-xs text-slate-500\">{person.lastDateKey || '—'} · {person.messageCount || 0} {t.messages}</p>{person.salesStage && <div className=\"mt-2 flex flex-wrap gap-2 text-[10px]\"><span className=\"rounded-full border border-indigo-400/20 bg-indigo-400/[0.06] px-2.5 py-1 text-indigo-200\">{SALES_STAGES.find(stage => stage.objective === person.salesStage)?.label[currentLang] || person.salesStage}</span>{person.lastCommercialAction && <span className=\"rounded-full border border-white/10 px-2.5 py-1 text-slate-400\">{person.lastCommercialAction === 'sent_manual' ? (currentLang === 'pt-BR' ? 'Enviado manualmente' : currentLang === 'es-ES' ? 'Enviado manualmente' : 'Manually sent') : person.lastCommercialAction === 'whatsapp_opened' ? 'WhatsApp' : (currentLang === 'pt-BR' ? 'Copiado' : currentLang === 'es-ES' ? 'Copiado' : 'Copied')}</span>}{person.followUpAt && <span className=\"rounded-full border border-amber-400/15 bg-amber-400/[0.05] px-2.5 py-1 text-amber-200\">{currentLang === 'pt-BR' ? 'Acompanhar' : currentLang === 'es-ES' ? 'Seguimiento' : 'Follow-up'} · {new Date(person.followUpAt).toLocaleDateString(currentLang)}</span>}</div>}</div>"""
          if target not in s: raise SystemExit('person heading marker missing')
          s=s.replace(target,replacement,1)
          p.write_text(s)

          # Tests: persistence, validation, action separation, follow-up and promotion metadata.
          p=Path('src/tests/personalRadarService.test.ts'); s=p.read_text()
          marker="""  const promotion = await service.promoteOpportunity(request, person.id);
  equal(promotion.success, true, 'opportunity promotion is an explicit manual action');"""
          extra="""  const staged = await service.updatePerson(request, person.id, { salesStage: 'pedir_video' });
  equal((vault.records.get(`personalPeople/${person.id}`) as any).salesStage, 'pedir_video', 'commercial stage persists across sessions');
  await service.updatePerson(request, person.id, { commercialAction: 'whatsapp_opened' });
  equal((vault.records.get(`personalPeople/${person.id}`) as any).lastCommercialAction, 'whatsapp_opened', 'WhatsApp open is tracked distinctly from sent');
  await service.updatePerson(request, person.id, { commercialAction: 'sent_manual', followUpDays: 2 });
  equal((vault.records.get(`personalPeople/${person.id}`) as any).lastCommercialAction, 'sent_manual', 'manual send is explicit');
  assert(typeof (vault.records.get(`personalPeople/${person.id}`) as any).followUpAt === 'string', 'manual send schedules follow-up');
  let invalidStageRejected = false;
  try { await service.updatePerson(request, person.id, { salesStage: 'invalid' as any }); } catch (error) { invalidStageRejected = error instanceof Error && error.message === 'SALES_STAGE_INVALID'; }
  assert(invalidStageRejected, 'invalid commercial stage fails closed');

"""+marker
          if marker not in s: raise SystemExit('test promotion marker missing')
          s=s.replace(marker,extra,1)
          s=s.replace("""  assert(vault.records.has(`relationshipOpportunities/${person.id}`), 'manual promotion creates an owner-scoped opportunity record');""", """  assert(vault.records.has(`relationshipOpportunities/${person.id}`), 'manual promotion creates an owner-scoped opportunity record');
  equal((vault.records.get(`relationshipOpportunities/${person.id}`) as any).salesStage, 'pedir_video', 'opportunity receives minimal commercial stage metadata');
  assert(typeof (vault.records.get(`relationshipOpportunities/${person.id}`) as any).followUpAt === 'string', 'opportunity receives follow-up metadata without raw history');""",1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Connect quality
        run: |
          npm run lint
          npm run test:core-http
          npm run test:radar-pilot
          npm run test:zerocost
          npm run test:gatewaytenant
          npm run test:authority
          npm run test:chartdelivery
          npm run test:firebase-hosting
          npm run test:release-policy
          npm run build
          npm run build:core
      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/client/personalRadarClient.ts src/personal/radar/personalRadarService.ts src/personal/radar/personalRadarHttp.ts src/features/radar/RadarPage.tsx src/tests/personalRadarService.test.ts
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 1
          fi
          git commit -m "Persist Radar commercial stage and follow-up actions"
          git push origin HEAD:fix/radar-commercial-state-followup-01
