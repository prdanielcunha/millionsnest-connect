name: Composer V2 Release Apply

on:
  push:
    branches:
      - release/composer-playbook-v2-01
    paths:
      - .github/workflows/composer-v2-release-apply.yml

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/composer-playbook-v2-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply verified main squash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git cherry-pick ae51e8a1b0aeb4fa70cc2ead4c7613ad045bb248
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify release
        run: |
          npm run lint
          npm run test:radar-pilot
          npm run test:release-policy
          npm run build
          npm run build:core
      - name: Remove one-shot workflow and publish release branch
        run: |
          git rm .github/workflows/composer-v2-release-apply.yml
          git commit -m "Remove Composer v2 one-shot release helper"
          git push origin HEAD:release/composer-playbook-v2-01
