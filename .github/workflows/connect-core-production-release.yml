name: Connect Core Production Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: connect-core-production-release
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  REGION: us-central1
  SERVICE: connect-api
  REPOSITORY: millionsnest-web
  IMAGE: us-central1-docker.pkg.dev/millionsnest/millionsnest-web/connect-api:${{ github.sha }}

jobs:
  release:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate frontend and Core
        run: |
          npm run lint
          npm run test:core-http
          npm run test:zerocost
          npm run test:gatewaytenant
          npm run test:authority
          npm run test:chartdelivery
          npm run test:firebase-hosting
          npm run build
          npm run build:core

      - name: Build and smoke Core container locally
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile.core -t connect-api:release .
          docker run -d --rm --name connect-core-release-smoke \
            -e PORT=8080 \
            -e MILLIONSNEST_HUB_ORIGIN=https://www.millionsnest.com \
            -e MUSICSCALE_ORIGIN=https://musicscale.millionsnest.com \
            -p 18083:8080 connect-api:release
          trap 'docker stop connect-core-release-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18083/api/health >/tmp/connect-health.json; then
              node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-health.json','utf8'));if(x.success!==true||x.service!=='millionsnest-connect-core')process.exit(1)"
              echo "CONNECT_CORE_LOCAL_RELEASE_SMOKE_OK"
              exit 0
            fi
            sleep 1
          done
          docker logs connect-core-release-smoke
          exit 1

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Verify Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" \
            --project "$PROJECT_ID" \
            --location "$REGION" \
            --format='value(name)' >/tmp/connect-artifact-repo.txt
          test -s /tmp/connect-artifact-repo.txt

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build immutable production image
        run: docker build -f Dockerfile.core -t "$IMAGE" .

      - name: Push immutable production image
        run: docker push "$IMAGE"

      - name: Deploy Connect Core revision
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 40 \
            --timeout 60 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,MILLIONSNEST_HUB_ORIGIN=https://www.millionsnest.com,MUSICSCALE_ORIGIN=https://musicscale.millionsnest.com" \
            --quiet

      - name: Verify Cloud Run readiness
        run: |
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='table(metadata.name,status.url,status.latestReadyRevisionName,status.conditions[0].type,status.conditions[0].status)'

      - name: Deploy Connect Firebase Hosting with API rewrite
        run: npx -y firebase-tools@15.26.0 deploy --only hosting:connect --project "$PROJECT_ID" --non-interactive

      - name: Production smoke through Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mn-connect-555464791734.web.app"

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            "$BASE/" -o /tmp/connect-index.html
          grep -Eiq '<!doctype html|<html' /tmp/connect-index.html

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            "$BASE/api/health" -o /tmp/connect-health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-health.json','utf8'));if(x.success!==true||x.service!=='millionsnest-connect-core')process.exit(1)"

          STATUS="$(curl --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            -o /tmp/connect-core-unauth.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"message":"Qual é minha próxima escala?"}' \
            "$BASE/api/core/message")"
          test "$STATUS" = "401"

          echo "CONNECT_PRODUCTION_RELEASE_OK"
