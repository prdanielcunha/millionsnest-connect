# Combined release: preserve live401 gates and validate against current main before publication.
name: Connect Core Production Release

on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/connect-core-production-release.yml"
      - ".github/workflows/connect-direct-official-sso-release.yml"
      - ".github/workflows/connect-whatsapp-production-activation.yml"
      - "src/**"
      - "server/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile.core"
      - "firebase.json"
      - "millionsnest.app.json"
  workflow_dispatch:
    inputs:
      live_mode:
        description: "Build the Connect UI in LIVE_CORE mode"
        required: true
        default: false
        type: boolean
      live_activation_ack:
        description: "When live_mode=true, type CONNECT_LIVE_READY"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: connect-core-production-release
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  REGION: us-central1
  SERVICE: connect-api
  REPOSITORY: millionsnest-web
  RUNTIME_SA: mn-connect-runtime@millionsnest.iam.gserviceaccount.com
  IMAGE: us-central1-docker.pkg.dev/millionsnest/millionsnest-web/connect-api:${{ github.sha }}
  CONNECT_CANONICAL_ORIGIN: https://connect.millionsnest.com
  CONNECT_HOSTING_FALLBACK_ORIGIN: https://mn-connect-555464791734.web.app
  # Firebase Web API keys are public client configuration, not credentials.
  # Pin the same canonical MillionsNest project config used by Hub so the
  # custom-token exchange does not depend on Hosting's reserved init endpoint.
  VITE_FIREBASE_API_KEY: AIzaSyAhXY8TV8qoXz8Pd2u5jFHUTVssZmi3kMs

jobs:
  release:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Guard live activation intent
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "CONNECT_LIVE_MODE_PRESERVED_ON_PRODUCTION_PUSH"
          elif [ "${{ inputs.live_mode }}" = "true" ]; then
            test "${{ inputs.live_activation_ack }}" = "CONNECT_LIVE_READY"
            echo "CONNECT_LIVE_ACTIVATION_EXPLICITLY_ACKNOWLEDGED"
          else
            echo "CONNECT_LIVE_MODE_DISABLED"
          fi

      - name: Prove live upstream routes before activation
        if: github.event_name == 'push' || inputs.live_mode == true
        shell: bash
        run: |
          set -euo pipefail

          HUB_STATUS="$(curl --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            -o /tmp/hub-connect-session.json -w '%{http_code}' \
            'https://www.millionsnest.com/api/ecosystem/connect/session-context')"
          echo "CONNECT_UPSTREAM_HUB_SESSION_STATUS=$HUB_STATUS"
          test "$HUB_STATUS" = "401"

          HUB_JOURNEY_STATUS="$(curl --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            -o /tmp/hub-nestjourney-followup.json -w '%{http_code}' \
            'https://www.millionsnest.com/api/ecosystem/connect/nestjourney/followup-context?organizationId=release-smoke&followupId=release-smoke')"
          echo "CONNECT_UPSTREAM_HUB_JOURNEY_STATUS=$HUB_JOURNEY_STATUS"
          test "$HUB_JOURNEY_STATUS" = "401"

          probe_unauthenticated_route() {
            local name="$1"
            local url="$2"
            local status
            status="$(curl --silent --show-error --location \
              --retry 6 --retry-delay 2 --retry-all-errors \
              -o "/tmp/${name}.json" -w '%{http_code}' \
              "$url")"
            echo "CONNECT_UPSTREAM_ROUTE_STATUS=$name:$status"
            if [ "$status" != "401" ]; then
              echo "::error::CONNECT_UPSTREAM_AUTH_CONTRACT_FAILED route=$name status=$status"
              exit 1
            fi
          }

          probe_unauthenticated_route             "musicscale-connect-next"             "https://musicscale.millionsnest.com/api/v1/connect/next-schedule"
          probe_unauthenticated_route             "musicscale-connect-repertoire"             "https://musicscale.millionsnest.com/api/v1/connect/next-schedule/repertoire"
          probe_unauthenticated_route             "musicscale-connect-presence"             "https://musicscale.millionsnest.com/api/v1/connect/next-schedule/presence"
          probe_unauthenticated_route             "musicscale-connect-chart"             "https://musicscale.millionsnest.com/api/v1/connect/next-schedule/chart?title=release-smoke"

          echo "CONNECT_LIVE_UPSTREAM_ROUTE_PROOFS_OK"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate frontend and Core
        env:
          VITE_CONNECT_LIVE_ENABLED: ${{ github.event_name == 'push' || inputs.live_mode == true }}
        run: |
          npm run lint
          npm run test:core-http
          npm run test:whatsapp-assist
          npm run test:radar-pilot
          npm run test:zerocost
          npm run test:outbound
          npm run test:gatewaytenant
          npm run test:authority
          npm run test:chartdelivery
          npm run test:firebase-hosting
          npm run test:release-policy
          npm run build
          npm run build:core

      - name: Build and smoke Core container locally
        shell: bash
        run: |
          set -euo pipefail
          docker build -f Dockerfile.core -t connect-api:release .
          docker run -d --rm --name connect-core-release-smoke \
            -e PORT=8080 \
            -e MILLIONSNEST_HUB_ORIGIN=https://www.millionsnest.com \
            -e MUSICSCALE_ORIGIN=https://musicscale.millionsnest.com \
            -e CONNECT_RELEASE_SHA=${{ github.sha }} \
            -p 18083:8080 connect-api:release
          trap 'docker stop connect-core-release-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18083/api/health >/tmp/connect-health.json; then
              node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-health.json','utf8'));if(x.success!==true||x.service!=='millionsnest-connect-core'||x.releaseSha!==process.env.GITHUB_SHA)process.exit(1)"
              echo "CONNECT_CORE_LOCAL_RELEASE_SMOKE_OK"
              exit 0
            fi
            sleep 1
          done
          docker logs connect-core-release-smoke
          exit 1

      - name: Authenticate with MillionsNest production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Verify Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "$REPOSITORY" \
            --project "$PROJECT_ID" \
            --location "$REGION" \
            --format='value(name)' >/tmp/connect-artifact-repo.txt
          test -s /tmp/connect-artifact-repo.txt

      - name: Verify dedicated Connect runtime identity
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_EMAIL="$(gcloud iam service-accounts describe "$RUNTIME_SA" \
            --project "$PROJECT_ID" \
            --format='value(email)')"
          test "$RUNTIME_EMAIL" = "$RUNTIME_SA"
          echo "CONNECT_RUNTIME_IDENTITY_VERIFIED"

      - name: Configure Docker authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build immutable production image
        run: docker build -f Dockerfile.core -t "$IMAGE" .

      - name: Push immutable production image
        run: docker push "$IMAGE"

      - name: Capture current serving revision
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > /tmp/connect-service-before.json
          PREVIOUS_TRAFFIC_REVISION="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-service-before.json','utf8'));const t=(x?.status?.traffic||[]).find(v=>Number(v.percent)===100&&v.revisionName);process.stdout.write(t?.revisionName||'')")"
          test -n "$PREVIOUS_TRAFFIC_REVISION"
          echo "PREVIOUS_TRAFFIC_REVISION=$PREVIOUS_TRAFFIC_REVISION" >> "$GITHUB_ENV"
          echo "CONNECT_PREVIOUS_TRAFFIC_REVISION=$PREVIOUS_TRAFFIC_REVISION"

      - name: Capture existing Hosting version before any serving mutation
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$ACCESS_TOKEN"
          curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $ACCESS_TOKEN" \
            'https://firebasehosting.googleapis.com/v1beta1/sites/mn-connect-555464791734/releases?pageSize=1' > /tmp/connect-hosting-before.json
          PREVIOUS_HOSTING_VERSION="$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/connect-hosting-before.json','utf8'));const v=d.releases?.[0]?.version?.name;if(typeof v!=='string'||!/^sites\/mn-connect-555464791734\/versions\/[a-zA-Z0-9_-]+$/.test(v))process.exit(1);process.stdout.write(v)")"
          echo "PREVIOUS_HOSTING_VERSION=$PREVIOUS_HOSTING_VERSION" >> "$GITHUB_ENV"
          rm /tmp/connect-hosting-before.json
          echo CONNECT_PREVIOUS_HOSTING_VERSION_CAPTURED

      - name: Deploy Connect Core revision
        shell: bash
        run: |
          set -euo pipefail
          REVISION_SUFFIX="r${GITHUB_RUN_ID}"
          EXPECTED_RELEASE_REVISION="${SERVICE}-${REVISION_SUFFIX}"
          echo "EXPECTED_RELEASE_REVISION=$EXPECTED_RELEASE_REVISION" >> "$GITHUB_ENV"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --service-account "$RUNTIME_SA" \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 40 \
            --timeout 60 \
            --allow-unauthenticated \
            --update-secrets /var/run/secrets/connect-execution.json=connect-execution-v1:1 \
            --update-env-vars "NODE_ENV=production,MILLIONSNEST_HUB_ORIGIN=https://www.millionsnest.com,MUSICSCALE_ORIGIN=https://musicscale.millionsnest.com,CONNECT_PUBLIC_ORIGIN=$CONNECT_CANONICAL_ORIGIN,CONNECT_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY,CONNECT_RELEASE_SHA=${{ github.sha }},CONNECT_RELEASE_RUN_ID=$GITHUB_RUN_ID,CONNECT_EXECUTION_SECRET_FILE=/var/run/secrets/connect-execution.json,CONNECT_HOMOLOGATION_READ_ONLY=false,CONNECT_WEB_PUSH_ENABLED=false,CONNECT_PRODUCT_ROUTING_ENABLED=false,CONNECT_AUTOMATION_EXECUTION_ENABLED=false,CONNECT_NESTFINANCE_PENDING_DOCUMENTS_ENABLED=false,CONNECT_STORAGE_READINESS_PROBE_ENABLED=true,CONNECT_INBOX_DURABLE_ENABLED=true,CONNECT_INBOX_MESSAGE_CONTENT_ENABLED=true" \
            --quiet

      - name: Route traffic to exact released revision
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPECTED_RELEASE_REVISION:-}"

          EXACT_READY=false
          for attempt in {1..60}; do
            if gcloud run revisions describe "$EXPECTED_RELEASE_REVISION" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --format=json > /tmp/connect-release-revision.json 2>/dev/null; then
              if GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/connect-release-revision.json', 'utf8'));
          const ready = (x?.status?.conditions || []).some((c) => c.type === 'Ready' && c.status === 'True');
          const env = Object.fromEntries((x?.spec?.containers?.[0]?.env || []).map((e) => [e.name, e.value]));
          if (!ready) process.exit(1);
          if (env.CONNECT_RELEASE_SHA !== process.env.GITHUB_SHA) process.exit(1);
          if (env.CONNECT_RELEASE_RUN_ID !== process.env.GITHUB_RUN_ID) process.exit(1);
          NODE
              then
                EXACT_READY=true
                break
              fi
            fi
            echo "CONNECT_EXACT_REVISION_WAIT attempt=$attempt revision=$EXPECTED_RELEASE_REVISION"
            sleep 2
          done
          test "$EXACT_READY" = "true"
          echo "CONNECT_EXACT_REVISION_READY=$EXPECTED_RELEASE_REVISION"

          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-revisions="$EXPECTED_RELEASE_REVISION=100" \
            --quiet

          TRAFFIC_OK=false
          for attempt in {1..30}; do
            gcloud run services describe "$SERVICE" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --format=json > /tmp/connect-service-after.json
            if EXPECTED_RELEASE_REVISION="$EXPECTED_RELEASE_REVISION" node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/connect-service-after.json', 'utf8'));
          const expected = process.env.EXPECTED_RELEASE_REVISION;
          const target = (x?.status?.traffic || []).find((t) => t.revisionName === expected && Number(t.percent) === 100);
          if (!target) process.exit(1);
          NODE
            then
              TRAFFIC_OK=true
              break
            fi
            sleep 2
          done
          test "$TRAFFIC_OK" = "true"

          RELEASE_REVISION="$EXPECTED_RELEASE_REVISION"
          echo "RELEASE_REVISION=$RELEASE_REVISION" >> "$GITHUB_ENV"
          echo "CONNECT_RELEASE_TRAFFIC_ROUTED=$RELEASE_REVISION"

          SERVICE_URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          DIRECT_MATCHED=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location --max-time 10 \
              -H 'Cache-Control: no-cache, no-store' \
              "$SERVICE_URL/api/health?release=$GITHUB_SHA&run=$GITHUB_RUN_ID&attempt=$attempt" \
              -o /tmp/connect-direct-health.json; then
              if node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-direct-health.json','utf8'));if(x.success!==true||x.service!=='millionsnest-connect-core'||x.releaseSha!==process.env.GITHUB_SHA)process.exit(1)"; then
                DIRECT_MATCHED=true
                break
              fi
            fi
            sleep 2
          done
          test "$DIRECT_MATCHED" = "true"
          echo "CONNECT_DIRECT_RELEASE_SHA_OK=$GITHUB_SHA"

      - name: Verify Cloud Run readiness
        run: |
          gcloud run revisions describe "$RELEASE_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='table(metadata.name,status.conditions[0].type,status.conditions[0].status,spec.containers[0].image)'
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='table(metadata.name,status.url,status.traffic.revisionName,status.traffic.percent,status.traffic.tag)'

      - name: Deploy Connect Firebase Hosting with API rewrite
        run: npx -y firebase-tools@15.26.0 deploy --only hosting:connect --project "$PROJECT_ID" --non-interactive

      - name: Production smoke through canonical Connect domain
        shell: bash
        run: |
          set -euo pipefail
          BASE="$CONNECT_CANONICAL_ORIGIN"
          FALLBACK="$CONNECT_HOSTING_FALLBACK_ORIGIN"

          rollback() {
            if [ -n "${PREVIOUS_TRAFFIC_REVISION:-}" ]; then
              echo "::warning::Production smoke failed; restoring traffic to $PREVIOUS_TRAFFIC_REVISION"
              gcloud run services update-traffic "$SERVICE" \
                --project "$PROJECT_ID" \
                --region "$REGION" \
                --to-revisions="$PREVIOUS_TRAFFIC_REVISION=100" \
                --quiet || true
            fi
          }
          trap rollback ERR

          # Prove the Firebase site itself is healthy, but never treat the
          # technical web.app hostname as the canonical production URL.
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            "$FALLBACK/" -o /tmp/connect-firebase-index.html
          grep -Eiq '<!doctype html|<html' /tmp/connect-firebase-index.html

          # The release is only considered successful when the canonical
          # Connect domain serves the frontend and the matching Core revision.
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            "$BASE/" -o /tmp/connect-index.html
          grep -Eiq '<!doctype html|<html' /tmp/connect-index.html

          # Cloud Run/Firebase traffic propagation can briefly keep the previous
          # healthy revision visible after update-traffic returns. Converge on
          # the exact release SHA instead of failing on the first stale 200.
          CORE_MATCHED=false
          for attempt in {1..60}; do
            HEALTH_URL="$BASE/api/health?release=$GITHUB_SHA&run=$GITHUB_RUN_ID&attempt=$attempt"
            if curl --fail --silent --show-error --location --max-time 10 \
              -H 'Cache-Control: no-cache, no-store' \
              -H 'Pragma: no-cache' \
              "$HEALTH_URL" -o /tmp/connect-health.json; then
              CURRENT_SHA="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/connect-health.json','utf8'));process.stdout.write(String(x.releaseSha||''))}catch{}")"
              CURRENT_SERVICE="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/connect-health.json','utf8'));process.stdout.write(String(x.service||''))}catch{}")"
              if [ "$CURRENT_SERVICE" = "millionsnest-connect-core" ] && [ "$CURRENT_SHA" = "$GITHUB_SHA" ]; then
                CORE_MATCHED=true
                echo "CONNECT_CANONICAL_RELEASE_SHA_OK=$CURRENT_SHA"
                break
              fi
              echo "CONNECT_CANONICAL_RELEASE_WAIT attempt=$attempt currentSha=${CURRENT_SHA:-missing}"
            fi
            sleep 3
          done
          test "$CORE_MATCHED" = "true"

          STORAGE_READY=false
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location --max-time 10 \
              -H 'Cache-Control: no-cache, no-store' \
              "$BASE/api/health/storage-readiness?release=$GITHUB_SHA&attempt=$attempt" \
              -o /tmp/connect-storage-readiness.json; then
              if node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-storage-readiness.json','utf8'));if(x.success!==true||x.storageReadiness!=='read_write_confirmed')process.exit(1)"; then
                STORAGE_READY=true
                break
              fi
            fi
            sleep 3
          done
          test "$STORAGE_READY" = "true"
          STORAGE_STATE="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-storage-readiness.json','utf8'));process.stdout.write(x.storageReadiness)")"
          STORAGE_SOURCE="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-storage-readiness.json','utf8'));const allowed=new Set(['runtime_metadata','metadata_unavailable','project_iam_probe_unavailable','invalid_response']);if(!allowed.has(x.source))process.exit(1);process.stdout.write(x.source)")"
          echo "CONNECT_RUNTIME_FIRESTORE_SELF_PROBE_STATE=$STORAGE_STATE"
          echo "CONNECT_RUNTIME_FIRESTORE_SELF_PROBE_SOURCE=$STORAGE_SOURCE"
          echo "CONNECT_INBOX_STORAGE_GATE_OK"

          INBOX_AUTH_STATUS="$(curl --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            -o /tmp/connect-inbox-auth.json -w '%{http_code}' \
            "$BASE/api/core/inbox/threads/release-smoke?organizationId=release-smoke")"
          test "$INBOX_AUTH_STATUS" = "401"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-inbox-auth.json','utf8'));if(x.success!==false||x.code!=='AUTH_REQUIRED')process.exit(1)"
          echo "CONNECT_INBOX_DURABLE_AUTHORITY_OK"

          INBOX_LIST_STATUS="$(curl --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            -o /tmp/connect-inbox-list-auth.json -w '%{http_code}' \
            "$BASE/api/core/inbox/conversations?organizationId=release-smoke")"
          test "$INBOX_LIST_STATUS" = "401"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/connect-inbox-list-auth.json','utf8'));if(x.success!==false||x.code!=='AUTH_REQUIRED')process.exit(1)"
          echo "CONNECT_INBOX_QUERY_AUTHORITY_OK"

          OPERATOR_STATUS="$(curl --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            -o /tmp/connect-operator-auth.json -w '%{http_code}' \
            "$BASE/api/core/inbox/operators?organizationId=release-smoke")"
          test "$OPERATOR_STATUS" = "401"

          SEARCH_STATUS="$(curl --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            -o /tmp/connect-search-auth.json -w '%{http_code}' \
            "$BASE/api/core/inbox/conversations/search?organizationId=release-smoke&q=release")"
          test "$SEARCH_STATUS" = "401"

          # Notes are disabled without an explicit TTL gate (404) or, when
          # enabled, deny every unauthenticated read (401).
          NOTES_STATUS="$(curl --silent --show-error --location \
            --retry 6 --retry-delay 2 --retry-all-errors \
            -o /tmp/connect-notes-auth.json -w '%{http_code}' \
            "$BASE/api/core/inbox/threads/release-smoke/notes?organizationId=release-smoke")"
          test "$NOTES_STATUS" = "401" -o "$NOTES_STATUS" = "404"
          echo "CONNECT_INBOX_OPERATOR_SEARCH_NOTES_AUTHORITY_OK"

          MESSAGE_STATUS="$(curl --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            -o /tmp/connect-core-unauth.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"text":"Qual é minha próxima escala?"}' \
            "$BASE/api/core/message")"
          test "$MESSAGE_STATUS" = "401"

          SESSION_STATUS="$(curl --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            -o /tmp/connect-session-unauth.json -w '%{http_code}' \
            "$BASE/api/core/session?organizationId=release-smoke")"
          test "$SESSION_STATUS" = "401"

          OUTBOUND_STATUS="$(curl --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            -o /tmp/connect-outbound-unauth.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"organizationId":"release-smoke","sourceApp":"nestlocal"}' \
            "$BASE/api/core/outbound/validate")"
          test "$OUTBOUND_STATUS" = "401"

          JOURNEY_STATUS="$(curl --silent --show-error --location \
            --retry 12 --retry-delay 3 --retry-all-errors \
            -o /tmp/connect-journey-unauth.json -w '%{http_code}' \
            "$BASE/api/core/nestjourney/followup?organizationId=release-smoke&followupId=release-smoke")"
          test "$JOURNEY_STATUS" = "401"

          echo "CONNECT_CANONICAL_DOMAIN_OK=$BASE"
          echo "CONNECT_PRODUCTION_RELEASE_OK"
          echo "CONNECT_LIVE_MODE=${{ github.event_name == 'push' || inputs.live_mode == true }}"
          trap - ERR

      - name: Restore serving revision and Hosting on any release failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          rollback_failed=0
          if [ -n "${PREVIOUS_TRAFFIC_REVISION:-}" ]; then
            if gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
              --to-revisions="$PREVIOUS_TRAFFIC_REVISION=100" --quiet; then
              echo CONNECT_FAILURE_RUNTIME_TRAFFIC_RESTORED
            else
              rollback_failed=1
            fi
          fi
          if [ -n "${PREVIOUS_HOSTING_VERSION:-}" ]; then
            [[ "$PREVIOUS_HOSTING_VERSION" =~ ^sites/mn-connect-555464791734/versions/[a-zA-Z0-9_-]+$ ]]
            ACCESS_TOKEN="$(gcloud auth print-access-token)"
            echo "::add-mask::$ACCESS_TOKEN"
            curl --fail --silent --show-error --max-time 30 -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
              -d '{"message":"Connect guarded release rollback"}' \
              "https://firebasehosting.googleapis.com/v1beta1/sites/mn-connect-555464791734/releases?versionName=$PREVIOUS_HOSTING_VERSION" > /tmp/connect-hosting-rollback.json
            node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/connect-hosting-rollback.json','utf8'));if(d.version?.name!==process.env.PREVIOUS_HOSTING_VERSION)process.exit(1)"
            rm /tmp/connect-hosting-rollback.json
            echo CONNECT_FAILURE_HOSTING_VERSION_RESTORED
          fi
          test "$rollback_failed" = 0
