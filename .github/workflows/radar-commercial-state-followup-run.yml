name: Radar Commercial State Followup

on:
  push:
    branches:
      - fix/radar-commercial-state-followup-01
    paths:
      - scripts/radar_commercial_state_patch.py
      - .github/workflows/radar-commercial-state-followup-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/radar-commercial-state-followup-01
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch
        run: python scripts/radar_commercial_state_patch.py
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Verify
        run: |
          npm run lint
          npm run test:core-http
          npm run test:radar-pilot
          npm run test:zerocost
          npm run test:gatewaytenant
          npm run test:authority
          npm run test:chartdelivery
          npm run test:firebase-hosting
          npm run test:release-policy
          npm run build
          npm run build:core
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/client/personalRadarClient.ts src/personal/radar/personalRadarService.ts src/personal/radar/personalRadarHttp.ts src/features/radar/RadarPage.tsx src/tests/personalRadarService.test.ts
          git commit -m "Persist Radar commercial stage and follow-up actions"
          git push origin HEAD:fix/radar-commercial-state-followup-01
