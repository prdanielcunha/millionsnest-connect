name: NestJourney Official First Contact Activation

on:
  workflow_dispatch:
    inputs:
      activation_ack:
        description: "Type NESTJOURNEY_APPROVED_TEMPLATE_AND_CHARGES_ACCEPTED"
        type: string
        required: true
      template_name:
        description: "Approved, parameter-free Meta template (requires pt_BR)"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: connect-nestjourney-template-activation
  cancel-in-progress: false

env:
  PROJECT_ID: millionsnest
  REGION: us-central1
  SERVICE: connect-api
  META_WABA_ID: ${{ vars.CONNECT_WHATSAPP_WABA_ID }}
  META_GRAPH_VERSION: ${{ vars.CONNECT_WHATSAPP_GRAPH_API_VERSION }}
  META_ACCESS_TOKEN: ${{ secrets.CONNECT_WHATSAPP_ACCESS_TOKEN }}
  INPUT_TEMPLATE_NAME: ${{ inputs.template_name }}
  INPUT_ACK: ${{ inputs.activation_ack }}

jobs:
  activate:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require deliberate cost and privacy acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          test "$INPUT_ACK" = 'NESTJOURNEY_APPROVED_TEMPLATE_AND_CHARGES_ACCEPTED'
          [[ "$INPUT_TEMPLATE_NAME" =~ ^[a-z0-9_]{1,512}$ ]]
          [[ "$META_WABA_ID" =~ ^[0-9]{5,30}$ ]]
          [[ "$META_GRAPH_VERSION" =~ ^v[0-9]{1,3}\.[0-9]{1,3}$ ]]
          test -n "$META_ACCESS_TOKEN"
          echo 'NESTJOURNEY_TEMPLATE_OPERATOR_ACK_OK'

      - name: Verify approved parameter-free Meta template
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --show-error \
            --output /tmp/nestjourney-approved-template.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $META_ACCESS_TOKEN" \
            "https://graph.facebook.com/$META_GRAPH_VERSION/$META_WABA_ID/message_templates?fields=name,status,language,components&name=$INPUT_TEMPLATE_NAME&limit=100")
          test "$STATUS" = '200'
          node - <<'NODE'
          const fs=require('fs');
          const response=JSON.parse(fs.readFileSync('/tmp/nestjourney-approved-template.json','utf8'));
          const template=process.env.INPUT_TEMPLATE_NAME;
          const options=(response.data||[]).filter(row=>row.name===template&&row.status==='APPROVED');
          if(!options.some(row=>row.language==='pt_BR'))throw new Error('META_PT_BR_TEMPLATE_NOT_APPROVED');
          for(const row of options){
            if(JSON.stringify(row.components||[]).includes('{{'))
              throw new Error('DYNAMIC_TEMPLATE_PARAMETERS_NOT_SUPPORTED');
          }
          console.log('META_APPROVED_PARAMETER_FREE_FIRST_CONTACT_TEMPLATE_OK');
          NODE

      - name: Authenticate production WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/555464791734/locations/global/workloadIdentityPools/mn-prod-github/providers/github
          service_account: mn-web-deployer@millionsnest.iam.gserviceaccount.com

      - name: Require operational Firestore readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 \
            "https://connect.millionsnest.com/api/health/storage-readiness" \
            -o /tmp/nestjourney-runtime-readiness.json
          node - <<'NODE'
          const r=require('/tmp/nestjourney-runtime-readiness.json');
          if(r.success!==true||r.storageReadiness!=='read_write_confirmed')
            throw new Error('DURABLE_OUTBOX_NOT_READY');
          NODE

      - name: Enable template runtime with rollback guard
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_REVISION=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.traffic[0].revisionName)')
          test -n "$PREVIOUS_REVISION"
          rollback() {
            echo 'ACTIVATION_FAILED_ROLLING_BACK_TRAFFIC' >&2
            gcloud run services update-traffic "$SERVICE" \
              --project "$PROJECT_ID" --region "$REGION" \
              --to-revisions="$PREVIOUS_REVISION=100" --quiet || true
          }
          trap rollback ERR
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --update-env-vars="CONNECT_NESTJOURNEY_TEMPLATE_SEND_ENABLED=true,CONNECT_NESTJOURNEY_TEMPLATE_POLICY_ACK=APPROVED_TEMPLATE_AND_CHARGES_ACCEPTED,CONNECT_NESTJOURNEY_TEMPLATE_NAME=$INPUT_TEMPLATE_NAME" \
            --quiet
          STATUS=$(curl --silent --show-error \
            --output /tmp/nestjourney-template-unauth.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://connect.millionsnest.com/api/core/nestjourney/followup/send-template")
          test "$STATUS" = '401'
          echo 'NESTJOURNEY_OFFICIAL_TEMPLATE_RUNTIME_ACTIVATED'
          trap - ERR
