name: Dispatch Relationship Intelligence V3 Production Once

on:
  push:
    branches:
      - ops/release-relationship-intelligence-v3-prod
    paths:
      - .github/workflows/dispatch-relationship-intelligence-v3-prod-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/connect-core-production-release.yml/dispatches" \
            -f ref=production \
            -f 'inputs[live_mode]=true' \
            -f 'inputs[live_activation_ack]=CONNECT_LIVE_READY'
          echo "RELATIONSHIP_INTELLIGENCE_V3_PRODUCTION_RELEASE_DISPATCHED"
