name: Source-aware production port fixed

on:
  push:
    branches:
      - release/source-aware-identity-production-01
    paths:
      - .github/workflows/source-aware-production-port-fixed.yml

permissions:
  contents: write

jobs:
  port-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: release/source-aware-identity-production-01
      - name: Port source-aware identity feature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              Path(path).write_text(content)

          def replace_once(content, before, after, label):
              count = content.count(before)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 anchor, found {count}')
              return content.replace(before, after, 1)

          service = read('src/personal/radar/personalRadarService.ts')
          service = replace_once(service, "import { extractWhatsAppText, parseWhatsAppExport, ParsedWhatsAppMessage } from '../whatsapp/whatsappExport';\n", "import { extractWhatsAppText, parseWhatsAppExport, ParsedWhatsAppMessage } from '../whatsapp/whatsappExport';\nimport { deriveConversationMetadata } from '../whatsapp/conversationIdentity';\nimport { inferProbableIdentity, IdentityInferenceEvidence } from './identityInference';\n", 'service imports')
          service = replace_once(service, "function validManualPriority(value: unknown): ManualPriority | undefined {\n  return ['normal', 'important', 'priority'].includes(String(value))\n    ? value as ManualPriority\n    : undefined;\n}\n", "function validManualPriority(value: unknown): ManualPriority | undefined {\n  return ['normal', 'important', 'priority'].includes(String(value))\n    ? value as ManualPriority\n    : undefined;\n}\n\nfunction mergeIdentityEvidence(existingValue: unknown, incomingValue: unknown): IdentityInferenceEvidence[] {\n  const map = new Map<string, IdentityInferenceEvidence>();\n  const collect = (value: unknown) => {\n    if (!Array.isArray(value)) return;\n    for (const item of value as IdentityInferenceEvidence[]) {\n      if (!item || typeof item !== 'object') continue;\n      const key = `${String(item.sourceId || '')}:${Number(item.messageIndex ?? -1)}:${String(item.kind || '')}`;\n      if (!map.has(key)) map.set(key, item);\n    }\n  };\n  collect(existingValue);\n  collect(incomingValue);\n  return Array.from(map.values()).sort((a, b) => b.score - a.score || String(b.dateKey).localeCompare(String(a.dateKey))).slice(0, 12);\n}\n\nfunction conversationSummary(conversation: Record<string, unknown>) {\n  return {\n    id: String(conversation.id || conversation.sourceId || ''),\n    sourceId: String(conversation.sourceId || conversation.id || ''),\n    conversationKey: String(conversation.conversationKey || conversation.sourceId || conversation.id || ''),\n    label: String(conversation.label || conversation.fileName || conversation.sourceId || 'WhatsApp'),\n    kind: String(conversation.kind || 'unknown'),\n    fileName: String(conversation.fileName || ''),\n    createdAt: String(conversation.createdAt || ''),\n    firstDateKey: typeof conversation.firstDateKey === 'string' ? conversation.firstDateKey : null,\n    lastDateKey: typeof conversation.lastDateKey === 'string' ? conversation.lastDateKey : null,\n    participantCount: Number(conversation.participantCount || (Array.isArray(conversation.participantNames) ? conversation.participantNames.length : 0)),\n    messageCount: Number(conversation.messageCount || 0),\n  };\n}\n", 'service helpers')
          service = replace_once(service, "    const parsed = parseWhatsAppExport(text);\n    const selfNames = normalizeSelfNames(input.selfNames);\n    const people = deriveRadarPeople({ messages: parsed.messages, selfNames }).slice(0, 250);\n    const createdAt = isoNow(this.now);\n", "    const parsed = parseWhatsAppExport(text);\n    const selfNames = normalizeSelfNames(input.selfNames);\n    const conversation = deriveConversationMetadata(fileName, parsed.participants, selfNames);\n    const people = deriveRadarPeople({ messages: parsed.messages, selfNames }).slice(0, 250).map(person => {\n      const inference = inferProbableIdentity({ displayName: person.displayName, phone: person.phone, messages: parsed.messages, sourceId });\n      return { ...person, probableName: inference.probableName, normalizedProbableName: inference.normalizedProbableName, probableNameConfidence: inference.confidence, probableNameScore: inference.score, identityEvidence: inference.evidence };\n    });\n    const createdAt = isoNow(this.now);\n", 'service import inference')
          service = replace_once(service, "          identityAliases: uniqueStrings(existing.identityAliases, existing.displayName, person.displayName),\n          identityConfirmedAliases: uniqueStrings(existing.identityConfirmedAliases, person.normalizedName),\n          identityConfidence: strong.match.confidence,\n", "          probableName: existing.probableName || person.probableName || null,\n          normalizedProbableName: existing.normalizedProbableName || person.normalizedProbableName || '',\n          probableNameConfidence: existing.probableNameConfidence || person.probableNameConfidence || 'none',\n          probableNameScore: Math.max(Number(existing.probableNameScore || 0), Number(person.probableNameScore || 0)),\n          identityEvidence: mergeIdentityEvidence(existing.identityEvidence, person.identityEvidence),\n          identityAliases: uniqueStrings(existing.identityAliases, existing.displayName, person.displayName, person.probableName),\n          identityConfirmedAliases: uniqueStrings(existing.identityConfirmedAliases, person.normalizedName),\n          identityConfidence: Math.max(strong.match.confidence, Number(person.probableNameScore || 0)),\n", 'service merge inference')
          service = replace_once(service, "        identityAliases: [person.displayName],\n        identityConfirmedAliases: [],\n        identityBlockedAliases: [],\n        identityConfidence: ambiguous.length ? ambiguous[0].confidence : 0,\n        identityResolution: ambiguous.length ? 'needs_review' : 'new_person',\n", "        identityAliases: uniqueStrings(person.displayName, person.probableName),\n        identityConfirmedAliases: [],\n        identityBlockedAliases: [],\n        identityConfidence: Math.max(ambiguous.length ? ambiguous[0].confidence : 0, Number(person.probableNameScore || 0)),\n        identityResolution: ambiguous.length ? 'needs_review' : person.probableName ? 'probable_name' : 'new_person',\n", 'service new identity')
          service = replace_once(service, "          fileName,\n          ownerUid: context.actorUid,\n          createdAt,\n          firstDateKey: parsed.firstDateKey,\n", "          fileName,\n          label: conversation.label,\n          kind: conversation.kind,\n          conversationKey: conversation.conversationKey,\n          ownerUid: context.actorUid,\n          createdAt,\n          firstDateKey: parsed.firstDateKey,\n", 'service source metadata')
          service = replace_once(service, "          fileName,\n          createdAt,\n          firstDateKey: parsed.firstDateKey,\n          lastDateKey: parsed.lastDateKey,\n          participantNames: parsed.participants.slice(0, 300),\n          messageCount: parsed.messages.length,\n", "          fileName,\n          label: conversation.label,\n          kind: conversation.kind,\n          conversationKey: conversation.conversationKey,\n          createdAt,\n          firstDateKey: parsed.firstDateKey,\n          lastDateKey: parsed.lastDateKey,\n          participantNames: parsed.participants.slice(0, 300),\n          participantCount: parsed.participants.length,\n          messageCount: parsed.messages.length,\n", 'service conversation metadata')
          service = replace_once(service, "      identityReviewCount,\n    };\n  }\n\n  async getRadar(request: RadarRequestContext) {\n", "      identityReviewCount,\n      conversationLabel: conversation.label,\n      conversationKind: conversation.kind,\n      conversationKey: conversation.conversationKey,\n    };\n  }\n\n  async getRadar(request: RadarRequestContext) {\n", 'service import result')
          service = replace_once(service, "    const people = await this.vault.list(request.authToken, context.actorUid, ['personalPeople'], 1_500);\n    const nowMs = this.now();\n", "    const people = await this.vault.list(request.authToken, context.actorUid, ['personalPeople'], 1_500);\n    const conversationsRaw = await this.vault.list(request.authToken, context.actorUid, ['personalConversations'], 300);\n    const conversations = conversationsRaw.map(conversationSummary).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));\n    const sourceMap = new Map(conversations.map(item => [item.sourceId, item]));\n    const nowMs = this.now();\n", 'service radar source load')
          service = replace_once(service, "      .filter(person => person.radarState !== 'ignored' && !isActivelySnoozed(person, nowMs) && !person.notRelevant)\n      .map(person => ({ ...(person as Record<string, unknown> & { id: string }), effectivePotential: safeEffectivePotential(person) }));\n", "      .filter(person => person.radarState !== 'ignored' && !isActivelySnoozed(person, nowMs) && !person.notRelevant)\n      .map(person => {\n        const sourceIds = uniqueStrings(person.sourceIds, person.sourceId);\n        return { ...(person as Record<string, unknown> & { id: string }), sourceIds, sources: sourceIds.map(sourceId => sourceMap.get(sourceId)).filter(Boolean), effectivePotential: safeEffectivePotential(person) };\n      });\n", 'service radar provenance')
          service = replace_once(service, "    return { people: visible, count: visible.length };\n  }\n\n\n  async getPeople(request: RadarRequestContext) {\n", "    return { people: visible, count: visible.length, conversations };\n  }\n\n\n  async getPeople(request: RadarRequestContext) {\n", 'service radar response')
          service = replace_once(service, "            sourceId,\n            sender: String(message?.sender || ''),\n", "            sourceId,\n            sourceLabel: String(conversation.label || conversation.fileName || sourceId),\n            sourceKind: String(conversation.kind || 'unknown'),\n            sender: String(message?.sender || ''),\n", 'service search provenance')
          write('src/personal/radar/personalRadarService.ts', service)

          client = read('src/core/client/personalRadarClient.ts')
          client = replace_once(client, "export type RadarManualPriority = 'normal' | 'important' | 'priority';\n", "export type RadarManualPriority = 'normal' | 'important' | 'priority';\n\nexport type RadarConversationSummary = { id: string; sourceId: string; conversationKey: string; label: string; kind: string; fileName: string; createdAt: string; firstDateKey?: string | null; lastDateKey?: string | null; participantCount: number; messageCount: number; };\nexport type RadarIdentityEvidence = { kind: string; score: number; sourceId: string; messageIndex: number; dateKey: string; sender: string; snippet: string; };\n", 'client source types')
          client = replace_once(client, "  displayName: string;\n  normalizedName?: string;\n", "  displayName: string;\n  normalizedName?: string;\n  probableName?: string | null;\n  normalizedProbableName?: string;\n  probableNameConfidence?: 'high' | 'medium' | 'low' | 'none';\n  probableNameScore?: number;\n  identityEvidence?: RadarIdentityEvidence[];\n  sources?: RadarConversationSummary[];\n", 'client person types')
          client = replace_once(client, "  async getRadar(): Promise<{ people: RadarClientPerson[]; count: number }> {\n", "  async getRadar(): Promise<{ people: RadarClientPerson[]; count: number; conversations: RadarConversationSummary[] }> {\n", 'client radar type')
          client = replace_once(client, "    return { people: Array.isArray(body.people) ? body.people : [], count: Number(body.count || 0) };\n", "    return { people: Array.isArray(body.people) ? body.people : [], count: Number(body.count || 0), conversations: Array.isArray(body.conversations) ? body.conversations : [] };\n", 'client radar response')
          write('src/core/client/personalRadarClient.ts', client)

          ui = read('src/features/radar/RadarPage.tsx')
          ui = replace_once(ui, "  RadarClientPerson,\n  RadarManualPriority,\n", "  RadarClientPerson,\n  RadarConversationSummary,\n  RadarManualPriority,\n", 'ui type import')
          ui = replace_once(ui, "const potentialOrder: RadarPotentialLevel[] = ['very_high', 'high', 'medium', 'low', 'unknown'];\n", "const sourceCopy = {\n  'pt-BR': { title: 'Conversas importadas', all: 'Todas as conversas', from: 'Veio de', group: 'Grupo', direct: 'Conversa', probable: 'Provável nome', original: 'Identificação no arquivo', how: 'Como o Connect chegou nisso', high: 'confiança alta', medium: 'confiança média', low: 'confiança baixa', none: 'sem confiança suficiente' },\n  'en-US': { title: 'Imported conversations', all: 'All conversations', from: 'From', group: 'Group', direct: 'Conversation', probable: 'Probable name', original: 'Identifier in file', how: 'How Connect inferred this', high: 'high confidence', medium: 'medium confidence', low: 'low confidence', none: 'not enough confidence' },\n  'es-ES': { title: 'Conversaciones importadas', all: 'Todas las conversaciones', from: 'Vino de', group: 'Grupo', direct: 'Conversación', probable: 'Nombre probable', original: 'Identificación en el archivo', how: 'Cómo Connect llegó a esto', high: 'confianza alta', medium: 'confianza media', low: 'confianza baja', none: 'sin confianza suficiente' },\n} satisfies Record<LanguageCode, Record<string, string>>;\n\nconst potentialOrder: RadarPotentialLevel[] = ['very_high', 'high', 'medium', 'low', 'unknown'];\n", 'ui source copy')
          ui = replace_once(ui, "  const t = copy[currentLang];\n", "  const t = copy[currentLang];\n  const s = sourceCopy[currentLang];\n", 'ui source copy bind')
          ui = replace_once(ui, "  const [people, setPeople] = useState<RadarClientPerson[]>([]);\n", "  const [people, setPeople] = useState<RadarClientPerson[]>([]);\n  const [conversations, setConversations] = useState<RadarConversationSummary[]>([]);\n  const [sourceFilter, setSourceFilter] = useState('all');\n", 'ui state')
          ui = replace_once(ui, "      setPeople(result.people);\n      setPhones(Object.fromEntries(result.people.map(person => [person.id, normalizePhoneForUse(person.phone)])));\n", "      setPeople(result.people);\n      setConversations(result.conversations || []);\n      setPhones(Object.fromEntries(result.people.map(person => [person.id, normalizePhoneForUse(person.phone)])));\n", 'ui refresh')
          ui = replace_once(ui, "  const visiblePeople = useMemo(() => people.filter(person => {\n    if (filter === 'favorites') return Boolean(person.favorite);\n", "  const visiblePeople = useMemo(() => people.filter(person => {\n    const sourceIds = person.sourceIds?.length ? person.sourceIds : [person.sourceId];\n    if (sourceFilter !== 'all' && !sourceIds.includes(sourceFilter)) return false;\n    if (filter === 'favorites') return Boolean(person.favorite);\n", 'ui filter')
          ui = replace_once(ui, "  }), [people, filter]);\n", "  }), [people, filter, sourceFilter]);\n", 'ui filter deps')
          ui = replace_once(ui, "      <section className=\"grid gap-3 lg:grid-cols-[1fr_auto] lg:items-center\">\n        <div className=\"flex gap-2 overflow-x-auto pb-1\">\n", "      {conversations.length > 0 && <section className=\"rounded-[24px] border border-white/10 bg-white/[0.022] p-3 sm:p-4\"><div className=\"flex items-center gap-2 text-xs font-semibold text-slate-300\"><FileArchive size={15} className=\"text-indigo-300\" /> {s.title}</div><div className=\"mt-3 flex gap-2 overflow-x-auto pb-1\"><button onClick={() => setSourceFilter('all')} className={`whitespace-nowrap rounded-xl border px-3 py-2 text-xs transition ${sourceFilter === 'all' ? 'border-indigo-400/30 bg-indigo-400/15 text-indigo-100' : 'border-white/8 bg-black/10 text-slate-500 hover:text-white'}`}>{s.all}</button>{conversations.map(conversation => <button key={conversation.sourceId} onClick={() => setSourceFilter(conversation.sourceId)} className={`whitespace-nowrap rounded-xl border px-3 py-2 text-left text-xs transition ${sourceFilter === conversation.sourceId ? 'border-indigo-400/30 bg-indigo-400/15 text-indigo-100' : 'border-white/8 bg-black/10 text-slate-500 hover:text-white'}`}><span className=\"font-medium\">{conversation.label}</span><span className=\"ml-2 text-[10px] opacity-60\">{conversation.kind === 'group' ? s.group : conversation.kind === 'direct' ? s.direct : 'WhatsApp'} · {conversation.messageCount}</span></button>)}</div></section>}\n\n      <section className=\"grid gap-3 lg:grid-cols-[1fr_auto] lg:items-center\">\n        <div className=\"flex gap-2 overflow-x-auto pb-1\">\n", 'ui conversation selector')
          ui = replace_once(ui, "<div className=\"text-xs font-medium text-slate-200\">{result.sender} · {result.dateKey}</div>", "<div className=\"text-xs font-medium text-slate-200\">{result.sender} · {result.dateKey}{result.sourceLabel ? ` · ${result.sourceLabel}` : ''}</div>", 'ui search source')
          ui = replace_once(ui, "<div className=\"flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl border border-white/10 bg-white/[0.045] text-sm font-semibold text-white\">{person.displayName?.slice(0, 1)?.toUpperCase() || '?'}</div>", "<div className=\"flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl border border-white/10 bg-white/[0.045] text-sm font-semibold text-white\">{(person.probableName || person.displayName)?.slice(0, 1)?.toUpperCase() || '?'}</div>", 'ui avatar')
          ui = replace_once(ui, "<h2 className=\"truncate text-base font-semibold text-white\">{person.displayName}</h2>", "<h2 className=\"truncate text-base font-semibold text-white\">{person.probableName || person.displayName}</h2>", 'ui heading')
          ui = replace_once(ui, "<span>{person.messageCount || 0} {t.messages}</span>{person.lastDateKey && <span>{person.lastDateKey}</span>}{person.sourceIds && person.sourceIds.length > 1 && <span>{person.sourceIds.length} fontes</span>}", "<span>{person.messageCount || 0} {t.messages}</span>{person.lastDateKey && <span>{person.lastDateKey}</span>}{person.probableName && <span>{s.original}: {person.displayName}</span>}{person.sourceIds && person.sourceIds.length > 1 && <span>{person.sourceIds.length} fontes</span>}", 'ui original id')
          ui = replace_once(ui, "            {candidate && <div className=\"mt-4 rounded-2xl border border-amber-300/15 bg-amber-300/[0.055] p-3\">", "            {person.sources?.length ? <div className=\"mt-3 flex flex-wrap items-center gap-1.5 text-[10px] text-slate-500\"><span className=\"mr-1\">{s.from}:</span>{person.sources.map(source => <button key={source.sourceId} onClick={() => setSourceFilter(source.sourceId)} className=\"rounded-lg border border-white/8 bg-black/15 px-2 py-1 text-slate-400 hover:border-indigo-400/25 hover:text-indigo-200\">{source.label}</button>)}</div> : null}\n\n            {person.probableName && person.identityEvidence?.length ? <div className=\"mt-4 rounded-2xl border border-sky-300/15 bg-sky-300/[0.045] p-3\"><div className=\"text-[10px] font-semibold uppercase tracking-[0.14em] text-sky-200/80\">{s.probable} · {s[person.probableNameConfidence || 'none']}</div><div className=\"mt-1 text-sm font-medium text-sky-50\">{person.probableName}</div><div className=\"mt-2 text-[10px] font-medium text-slate-500\">{s.how}</div>{person.identityEvidence.slice(0, 2).map((item, index) => <div key={`${item.sourceId}-${item.messageIndex}-${index}`} className=\"mt-1.5 text-xs leading-5 text-slate-400\">“{item.snippet}” <span className=\"text-slate-600\">· {item.dateKey}</span></div>)}</div> : null}\n\n            {candidate && <div className=\"mt-4 rounded-2xl border border-amber-300/15 bg-amber-300/[0.055] p-3\">", 'ui source evidence')
          ui = replace_once(ui, "<div className=\"mt-1 text-sm font-medium text-white\">{selected.person.displayName}</div>", "<div className=\"mt-1 text-sm font-medium text-white\">{selected.person.probableName || selected.person.displayName}</div>", 'ui composer identity')
          write('src/features/radar/RadarPage.tsx', ui)

          tests = read('src/tests/personalRadarService.test.ts')
          marker = "\nconsole.log(`✅ Passed ${passed} / ${total} tests.`);"
          extra = base64.b64decode('').decode('utf-8')
          tests = replace_once(tests, marker, extra + marker, 'service tests')
          write('src/tests/personalRadarService.test.ts', tests)
          print('PRODUCTION_SOURCE_AWARE_PORT_APPLIED')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify port
        run: |
          npm run lint
          npm run test:radar-pilot
          npm run test:core-http
          npm run test:zerocost
          npm run test:gatewaytenant
          npm run test:authority
          npm run test:chartdelivery
          npm run test:firebase-hosting
          npm run test:release-policy
          npm run build
          npm run build:core
      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "Connect: port source-aware imports to production"
          git push origin HEAD:release/source-aware-identity-production-01
