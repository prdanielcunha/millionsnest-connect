name: Connect Quality

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:core-http
      - run: npm run test:radar-pilot
      - run: npm run test:zerocost
      - run: npm run test:gatewaytenant
      - run: npm run test:authority
      - run: npm run test:chartdelivery
      - run: npm run test:firebase-hosting
      - run: npm run test:release-policy
      - run: npm run build
      - run: npm run build:core
