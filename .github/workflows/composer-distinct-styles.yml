name: Composer Distinct Styles

on:
  push:
    branches:
      - feature/composer-distinct-styles-01
    paths:
      - .github/workflows/composer-distinct-styles.yml
      - .github/scripts/apply_composer_distinct_styles.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/composer-distinct-styles-01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - name: Apply distinct Composer styles
        run: python3 .github/scripts/apply_composer_distinct_styles.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate
        run: |
          npm run lint
          npm run test:radar-pilot
          npm run test:core-http
          npm run build
          npm run build:core
      - name: Commit verified product changes and remove one-shot files
        run: |
          rm -f .github/workflows/composer-distinct-styles.yml .github/scripts/apply_composer_distinct_styles.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Composer styles semantically distinct"
          git push origin HEAD:feature/composer-distinct-styles-01
