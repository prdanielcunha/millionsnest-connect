name: Personal Sources V2 Fix Once

on:
  push:
    branches:
      - feature/personal-sources-v2-relationship-memory
    paths:
      - .github/workflows/personal-sources-v2-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/personal-sources-v2-relationship-memory
      - name: Apply focused type cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('src/personal/sources/personalSourcesService.ts')
          text = service.read_text()
          old = "    const people = (base.people as Array<Record<string, unknown> & { id: string }>).map(person => {"
          new = "    const people: Array<Record<string, unknown> & { id: string }> = (base.people as Array<Record<string, unknown> & { id: string }>).map(person => {"
          if old not in text:
              raise SystemExit('Expected grouped people declaration not found')
          service.write_text(text.replace(old, new, 1))

          page = Path('src/features/sources/PersonalSourcesPage.tsx')
          page_text = page.read_text()
          page_text = page_text.replace('  Clock3,\n', '', 1)
          page.write_text(page_text)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/personal/sources/personalSourcesService.ts src/features/sources/PersonalSourcesPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: type Personal Sources grouped people"
          git push origin HEAD:feature/personal-sources-v2-relationship-memory
